; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t-display-S3-pro]
board = lilygo-t-display-s3-pro
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-s3-pro>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Lilygo T-Display S3 Pro"'
	-DDISABLE_OTA

    -DROTATION=3 # Portrait, 3 to landscape
	-DHAS_TOUCH=1

	;TFT_eSPI display
	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=2  # Arduino_ST7796
	-DTFT_WIDTH=222
	-DTFT_HEIGHT=480
	-DTFT_MISO=8
	-DTFT_MOSI=17
	-DTFT_SCLK=18
	-DTFT_CS=39
	-DTFT_DC=9
	-DTFT_RST=47
	-DTFT_BL=48
	-DTOUCH_CS=9

	-D TFT_IPS=1
	-D TFT_COL_OFS1=49
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=49
	-D TFT_ROW_OFS2=0

	-DSDCARD_CS=14
	-DSDCARD_SCK=18
	-DSDCARD_MISO=8
	-DSDCARD_MOSI=17

	-DTFT_BRIGHT_FREQ=10000

