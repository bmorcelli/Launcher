; PlatformIO Project Configuration File
;
; Temporary serial-only PaperMono bring-up target. This environment deliberately
; excludes Launcher and all board-interface sources and links no peripheral libraries.

[env:m5stack-paper-mono]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.speed = 921600
build_src_filter =
	-<*>
	+<../boards/m5stack-paper-mono/safe_bringup.cpp>

; The safe source has no web assets, formatting pass, upload patch, or submodule
; dependencies. Keep only the normal linker setup and merged-image post step.
extra_scripts =
	support_files/enable_lto.py
	post:support_files/merge.py

build_flags =
	${env.build_flags}
	-DPAPERMONO_SAFE_BRINGUP=1
	-DPAPERMONO_CLASS_A_STAGE=1
	-DBOARD_HAS_PSRAM
	-DNO_GLOBAL_SERIAL=1
	-DSerial=HWCDCSerial
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
