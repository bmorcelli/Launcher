; PlatformIO Project Configuration File
;
; M5Stack PaperMono: ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM.
; Display, touch, PM1, IOE1 and the PaperMono EPD wiring are auto-detected
; and configured by the pinned M5Unified/M5GFX versions.

[env:m5stack-paper-mono]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/m5stack-paper-mono>

build_flags =
	${env.build_flags}
	-DM5STACK
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"M5Stack PaperMono"'
	-DOTA_TAG='"paper-mono"'
	-DOTA_EXTRA='"esp=S3"'

	-DUSE_M5GFX=1
	-DE_PAPER_DISPLAY=1

	-DROTATION=0
	-DDIMMER_SETUP=0

	-DFP=2
	-DFM=4
	-DFG=6

	-DHAS_TOUCH=1
	-DTFT_WIDTH=480
	-DTFT_HEIGHT=800

	; PaperMono native 4-bit SDMMC. M5Unified/M5GFX handles TF_EN
	; initialization; Launcher only mounts the existing SDM abstraction.
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=13
	-DPIN_SD_CMD=12
	-DPIN_SD_D0=11
	-DPIN_SD_D1=10
	-DPIN_SD_D2=9
	-DPIN_SD_D3=8

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ 0.2.20
	m5stack/M5GFX @ 0.2.27

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
