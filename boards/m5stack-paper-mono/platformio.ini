; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-paper-mono]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/m5stack-paper-mono>
build_flags =
	${env.build_flags}
	-DM5STACK
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"M5Stack Paper Mono"'
	-DOTA_TAG='"paper"'
	-DOTA_EXTRA='"esp=S3"'

	-DLAUNCHER_GPIO_KEYS='{2, 3}' # Choose among available GPIO to start Launcher when booting

	-DUSE_M5GFX=1
	-DE_PAPER_DISPLAY=1
	;-DUSE_CANVAS=1

	-DROTATION=0
	-DDIMMER_SETUP=30

	-DFP=2
	-DFM=3
	-DFG=5

	-DBUTTONS_IDF_COMPONENT=1
	-DHAS_2_BUTTONS=1
	-DHAS_TOUCH=1
	-DTFT_WIDTH=480
	-DTFT_HEIGHT=800

	; SD card — native 4-bit SDIO. sd_functions.cpp calls SD_MMC.setPins() and
	; mounts it in 4-bit mode from these flags, no board-side code needed.
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=13
	-DPIN_SD_CMD=12
	-DPIN_SD_D0=11
	-DPIN_SD_D1=10
	-DPIN_SD_D2=9
	-DPIN_SD_D3=8


lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.21
	https://github.com/bmorcelli/ESP32_Button

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
