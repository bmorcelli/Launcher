; PlatformIO Project Configuration File
;
; M5Stack PaperMono production skeleton: ESP32-S3R8, 16 MB flash and
; 8 MB octal PSRAM. M5Unified/M5GFX provide the native board detection.

[env:m5stack-paper-mono]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.speed = 921600
build_src_filter =
	${env.build_src_filter}
	+<../boards/m5stack-paper-mono/interface.cpp>
	+<../boards/m5stack-paper-mono/papermono_bsp.cpp>
	+<../boards/m5stack-paper-mono/papermono_bootstrap.cpp>
	+<../boards/m5stack-paper-mono/papermono_display.cpp>
	+<../boards/m5stack-paper-mono/papermono_frontlight.cpp>
	+<../boards/m5stack-paper-mono/papermono_refresh_manager.cpp>
	+<../boards/m5stack-paper-mono/papermono_storage.cpp>
	+<../boards/m5stack-paper-mono/papermono_touch.cpp>

build_flags =
	${env.build_flags}
	-DM5STACK
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"M5Stack PaperMono"'
	-DOTA_TAG='"paper-mono"'
	-DOTA_EXTRA='"esp=S3"'

	-DUSE_PAPERMONO_SOFTWARE=1
	-DE_PAPER_DISPLAY=1
	-DPAPERMONO_P2_NO_REFRESH_BOOTSTRAP=1
	-DFREEINK_DEVICE_PAPERMONO=1
	-DPAPERMONO_PRODUCTION_DISPLAY_BACKEND=1
	; P5-A1B4 temporary hardware gate: one explicit Full after the first staged Launcher frame.
	-DPAPERMONO_P5_A1B4_ONE_SHOT_FULL_REFRESH=1

	-DROTATION=0
	-DDIMMER_SETUP=0

	-DFP=2
	-DFM=4
	-DFG=6

	-DHAS_TOUCH=1
	-DTFT_WIDTH=480
	-DTFT_HEIGHT=800

	; SDMMC and TF_EN/TF_DET sequencing are intentionally deferred to P3.

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ 0.2.20
	m5stack/M5GFX @ 0.2.27

lib_ignore =
	SensorLib
	XPowersLib

; Temporary P2 hardware-validation target. PaperMono board power bootstrap is
; performed without M5.begin(), while Launcher application drawing stays routed
; to Dummy TFT.
[env:m5stack-paper-mono-p2-display-blocked]
extends = env:m5stack-paper-mono
build_flags =
	${env:m5stack-paper-mono.build_flags}
	-UPAPERMONO_PRODUCTION_DISPLAY_BACKEND

; P3-A2 touch-only hardware gate. It retains the display-blocked P2 bootstrap,
; then polls FT6336G and emits bounded serial telemetry without entering the
; Launcher runtime.
[env:m5stack-paper-mono-p3-touch-bringup]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P3_TOUCH_BRINGUP=1

; P3-A3 TF-only hardware gate. It retains the display-blocked P2 bootstrap,
; performs bounded read-only SDMMC telemetry, then remains in a safe idle loop.
[env:m5stack-paper-mono-p3-sd-bringup]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P3_SD_BRINGUP=1

; P3-A4 frontlight-only hardware gate. It keeps the P2 display-blocked
; bootstrap, then performs one bounded 10 percent frontlight observation.
[env:m5stack-paper-mono-p3-frontlight-bringup]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P3_FRONTLIGHT_BRINGUP=1

; P4-A2 no-refresh display gate. It retains the display-blocked P2 bootstrap
; and enters only the board-local SSD1677 containment service.
[env:m5stack-paper-mono-p4-display-no-refresh]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P4_DISPLAY_NO_REFRESH=1

; P4-A5 isolated controller-OTP one-shot gate. It retains the P2
; display-blocked bootstrap and never returns to Launcher runtime.
[env:m5stack-paper-mono-p4-otp-single-refresh]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P4_OTP_SINGLE_REFRESH=1

; P4-B1 isolated controller-OTP full-refresh gate. It retains the P2
; display-blocked bootstrap and never returns to Launcher runtime.
[env:m5stack-paper-mono-p4-otp-full-refresh]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P4_OTP_FULL_REFRESH=1

; P4-B4A isolated repeated-partial state gate. It uses a hardware-proven full
; baseline, then performs exactly two host-shadow partial transitions with full
; containment between each controller invocation.
[env:m5stack-paper-mono-p4-repeated-partial]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P4_REPEATED_PARTIAL=1

; P4-B4D isolated refresh-manager policy gate. It remains display-blocked
; outside its bounded validation flow and does not enter Launcher runtime.
[env:m5stack-paper-mono-p4-refresh-manager]
extends = env:m5stack-paper-mono-p2-display-blocked
build_flags =
	${env:m5stack-paper-mono-p2-display-blocked.build_flags}
	-DPAPERMONO_P4_REFRESH_MANAGER=1
