; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-paper-mono]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/m5stack-paper-mono>
build_flags =
	${env.build_flags}
	-DM5STACK
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"M5Stack Paper Mono"'
	-DOTA_TAG='"paper"'
	-DOTA_EXTRA='"esp=S3"'

	-DLAUNCHER_GPIO_KEYS='{{"Up", 2}, {"Down", 3}}' # Choose among available GPIO to start Launcher when booting

	# M5GFX's own e-paper waveforms for this board are documented as unstable
	# (https://docs.m5stack.com/en/core/PaperMono); this drives the SSD1677
	# directly via GxEPD2 instead, same as M5's own OTP-LUT reference driver
	# -- see lib/DisplayDrivers/src/panels/GxEPD2_397_M5PAPERMONO.*
	-DUSE_GXEPD2=1
	-DE_PAPER_DISPLAY=1
	-D GXEPD2_PANEL=GxEPD2_426_SEEED_GDEQ0426T82

	-D STICKY_MONOCHROME=1

	-DGXEPD2_BEGIN_SPI=1
	-DGXEPD2_FULL_REFRESH_INTERVAL=20

	-DROTATION=3
	-DDIMMER_SETUP=30

	-DFP=2
	-DFM=3
	-DFG=5

	-DBUTTONS_IDF_COMPONENT=1
	-DHAS_2_BUTTONS=1
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_FT6X36=1
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=480

	-DTFT_SCLK=15
	-DTFT_MOSI=14
	-DTFT_CS=16
	-DTFT_DC=17
	-DTFT_BUSY=18

	; SD card — native 4-bit SDIO. sd_functions.cpp calls SD_MMC.setPins() and
	; mounts it in 4-bit mode from these flags, no board-side code needed.
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=13
	-DPIN_SD_CMD=12
	-DPIN_SD_D0=11
	-DPIN_SD_D1=10
	-DPIN_SD_D2=9
	-DPIN_SD_D3=8


lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4
	https://github.com/m5stack/M5PM1.git
	https://github.com/m5stack/M5IOE1.git
	https://github.com/bmorcelli/ESP32_Button

lib_ignore =
	XPowersLib
	GFX Library for Arduino
