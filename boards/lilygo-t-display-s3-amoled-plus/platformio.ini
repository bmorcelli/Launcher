; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t-display-S3-amoled-plus]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-s3-amoled-plus>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Lilygo T-Display AMOLED Plus"'
	-DDISABLE_OTA

	-DFP=2
	-DFM=3
	-DFG=4

    -DROTATION=3 # Portrait, 3 to landscape
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_CST8XX=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DPMIC_BQ25896=1 # hal_pmic_init/hal_pmic_get_ntc_percent (src/hal/power/pmic.cpp)

	# Plain SPI, not QSPI: the backend picks the RM67162's SPI register table.
	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=35 # Arduino_RM67162
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=536
	-D TFT_CS=6
	-D TFT_DC=7
	-D TFT_SCLK=47
	-D TFT_MOSI=18
	-D TFT_MISO=-1
	-D TFT_RST=17
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	-DSDCARD_CS=11
	-DSDCARD_SCK=14
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=12

