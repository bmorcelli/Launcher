; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-watch-s3]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-watch-s3>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Lilygo T-Watch S3"'
	-DOTA_TAG='"t-watch-s3"'

	-DROTATION=2

	;TouchScreen Controller
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_FT6X36=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)

	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_BL=45
	-DTFT_MISO=-1
	-DTFT_MOSI=13
	-DTFT_SCLK=18
	-DTFT_CS=12
	-DTFT_DC=38
	-DTFT_RST=-1
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1

	-DTFT_IPS=1
	-DTFT_COL_OFS1=0
	-DTFT_ROW_OFS1=80
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=80


	;SD Card Setup pins
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

