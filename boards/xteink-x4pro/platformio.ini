; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Xteink X4 Pro.
;
; Despite the name, this shares nothing with the X4 but the vendor: it is an
; ESP32-S3 with 8 MB of PSRAM, a GT911 touch panel, a two-channel frontlight,
; an SDMMC card slot and an I2C fuel gauge. Not one pin is in common. Treat the
; xteink-x3-x4 board as a different product.
;
; The hardware map below comes from the FreeInk SDK's bring-up document, where
; every line is marked confirmed-on-bench:
;   https://github.com/Free-Ink/freeink-sdk/blob/main/docs/xteink-x4pro-support.md
;
; ---------------------------------------------------------------------------
; PANEL BATCH VARIANTS — all three are built in and picked at boot
; ---------------------------------------------------------------------------
; The 800x480 glass is the same across batches, but the controller behind it is
; not, and which one a unit carries is not knowable at build time. interface.cpp
; reads it off the panel before the display is built:
;
;   * SSD1677 — original units.                                     -> index 0
;   * UC8179  — newer batches (UltraChip). Same KW command family as the X3's
;               UC8253, but needs an explicit PLL/booster/VCOM bring-up rather
;               than the SSD1677's OTP waveform.                    -> index 1
;   * UC8279  — a second UltraChip variant (LUT_VER 0x02/0x68): its own PSR/PLL
;               init, no CDI on the B/W path, and a 120-gate offset. -> index 2
;
; The SSD1677 is told apart by BUSY polarity alone — it flags busy HIGH and so
; idles LOW, the UltraChip parts idle HIGH. Those two are then separated by the
; VER register (0x70). See lib/xteink_panel/xteink_panel_probe. An unrecognised
; answer falls back to the UC8179, the first of the UltraChip batches.
; ---------------------------------------------------------------------------

[env:xteink-x4pro]
; Own JSON rather than the platform's esp32-s3-devkitc1-n16r8: this project
; points board_build.variants_dir at boards/, so a board has to name the
; universal "pinouts" variant or pins_arduino.h does not resolve.
board = xteink-x4pro   ; ESP32-S3, 16 MB flash + 8 MB octal PSRAM, matches the OEM dump
board_build.partitions = support_files/custom_16Mb.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 1572864
build_src_filter = ${env.build_src_filter} +<../boards/xteink-x4pro>

build_flags =
	${env.build_flags}
	-D BOARD_HAS_PSRAM=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

	# Device information
	-D DEVICE_NAME='"xteink x4 pro"'
	-D OTA_TAG='"xteink-x4pro"' # This tag must be added into the OTA Backend
	-D DISABLE_OTA=1                 # Disable OTA Functionality

	# Flags to increase the font sizes, increasing UI icons and texts
	-D FP=3
	-D FM=5
	-D FG=7

	# Screen default rotation
	-D ROTATION=0

	# Navigation layout
	# Only two physical nav buttons (Left GPIO0 / Right GPIO7) plus Power on
	# GPIO3. Everything else is the touch panel — including Home, which is a
	# capacitive key inside the GT911 rather than a GPIO. So no HAS_n_BUTTONS.
	#
	# Note: the OEM dump still carries an ADC resistor ladder matcher, and an
	# early reverse-engineering pass took it for this device's input path. It is
	# vestigial and not wired — do not resurrect it here.
	-D HAS_TOUCH=1     # Touchscreen, display the footer bar with btns description

	-D USE_GXEPD2=1      # to use GxEPD2 display library
	-D E_PAPER_DISPLAY=1

	-D TFT_WIDTH=800
	-D TFT_HEIGHT=480

	# The three controllers this glass has shipped behind, picked at boot by
	# interface.cpp. Same classes the X3/X4 env uses; about 3.8 kB per alternate.
	-D GXEPD2_PANEL=GxEPD2_426_GDEQ0426T82
	-D GXEPD2_PANEL_ALT1=GxEPD2_X4_800x480_UC8179
	-D GXEPD2_PANEL_ALT2=GxEPD2_X4_800x480_UC8279

	# Display pins. Nothing shares this bus, so the GxEPD2 backend can bring it
	# up itself; the panel is write-only, hence no MISO.
	-D TFT_SCLK=12
	-D TFT_MOSI=11
	-D TFT_CS=13
	-D TFT_DC=18
	-D TFT_RST=14
	-D TFT_BUSY=6
	-D GXEPD2_BEGIN_SPI=1

	# SDCard: native SDMMC in 1-bit mode, NOT SPI. An SPI-mode CMD0 gets no
	# answer from this slot, which is why an SPI card path can never work here.
	# GPIO5 gates the card's data path and is handled in interface.cpp.
	-D USE_SD_MMC=1
	-D SDM=SD_MMC
	-D PIN_SD_CLK=41
	-D PIN_SD_CMD=42
	-D PIN_SD_D0=40

lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4

lib_ignore =
	XPowersLib
	GFX Library for Arduino
