##################################### ES3C40P (ESP32-S3 + 4.0" ST7796S IPS + FT6336U cap touch) ##################################
; 4.0" ESP32-S3 IPS LCD Display Module (ESP32-S3R8: 16MB flash, 8MB OPI PSRAM, 320x480 ST7796S).
; Generic esp32s3 board JSON already configures 16MB flash + qio_opi PSRAM @ 80MHz.
[env:ES3C40P]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ES3C28P>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DDEVICE_NAME='"ES3C40P"'
	-DOTA_TAG='"es3c40p"'

	-DROTATION=1

	; Touch — FT6336U @ 0x38 on I2C0 (shared with ES8311 @ 0x18)
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_FT6X36=1
	-DTOUCH_SDA=16
	-DTOUCH_SCL=15
	-DTOUCH_RST=18
	-DTOUCH_INT=17
	-DTOUCH_CS=-1

	; Display — ST7796S 320x480 IPS over dedicated HWSPI
	-D TFT_DATABUS_N=0         # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=2  # Arduino_ST7796
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_RST=-1
	-DTFT_BL=45
	; Note: ES3C40P uses an IPS ST7796S panel (unlike the resistive TN E32R40T which uses TFT_IPS=0),
	; so TFT_IPS=1 sends INVON automatically without needing LCDWiki's patched ST7796_Init.h:
	-D TFT_IPS=1
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	-DDIMMER_SETUP=20

	; SD card — native 4-bit SDIO
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=38
	-DPIN_SD_CMD=40
	-DPIN_SD_D0=39
	-DPIN_SD_D1=41
	-DPIN_SD_D2=48
	-DPIN_SD_D3=47

	; Peripherals matching ES3C28P/ES3C40P schematic
	-DANALOG_BAT_PIN=9
	-DRGB_LED_PIN=42
	-DAUDIO_EN_PIN=1

lib_ignore =
	XPowersLib
