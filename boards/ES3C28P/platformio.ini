; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################### ES3C28P (ESP32-S3 + 2.8" ILI9341V + FT6336G cap touch) ##################################
; 2.8" ESP32-S3 IPS LCD Display Module (ESP32-S3R8: 16MB flash, 8MB OPI PSRAM).
; The generic esp32s3 JSON already matches this module (16MB / qio_opi / 80MHz),
; so no board_* override is needed beyond the partition table.
; https://www.lcdwiki.com/2.8inch_ESP32-S3_Display
[env:ES3C28P]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ES3C28P>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DDEVICE_NAME='"ES3C28P"'
	-DOTA_TAG='"es3c28p"'

	-DROTATION=1

	; TFT — ILI9341V 240x320 IPS on its own SPI bus (the SD card is SDIO, not shared)
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_FT6X36=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)

	-D TFT_DATABUS_N=0         # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=4  # Arduino_ILI9341
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_RST=-1
	-DTFT_BL=45
	-DTOUCH_CS=-1
	# IPS panel: Arduino_GFX sends INVON when ips is true, which is how this
	# backend expresses what TFT_eSPI called TFT_INVERSION_ON.
	-D TFT_IPS=1
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	; Backlight PWM (TFT_BRIGHT_CHANNEL/Bits/FREQ come from pre_compiler.h)
	-DDIMMER_SETUP=20

	; Capacitive touch — FT6336G @ 0x38 on I2C0, shared with the ES8311 codec
	-DTOUCH_SDA=16
	-DTOUCH_SCL=15
	-DTOUCH_RST=18
	-DTOUCH_INT=17

	; SD card — native 4-bit SDIO. sd_functions.cpp calls SD_MMC.setPins() and
	; mounts it in 4-bit mode from these flags, no board-side code needed.
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=38
	-DPIN_SD_CMD=40
	-DPIN_SD_D0=39
	-DPIN_SD_D1=41
	-DPIN_SD_D2=48
	-DPIN_SD_D3=47

	; Battery sense, through a voltage divider (read value x2)
	-DANALOG_BAT_PIN=9

	; WS2812 status LED, driven by the core's neopixelWrite() — no extra library
	-DRGB_LED_PIN=42

	; ES8311 audio codec enable line (active LOW). Held off at boot; the I2S
	; pins are documented in connections.md and unused by the launcher.
	-DAUDIO_EN_PIN=1

lib_ignore =
	XPowersLib
