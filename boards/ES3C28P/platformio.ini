; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:ES3C28P]
board = ES3C28P
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/myLibBuilder/releases/download/builds/launcher_esp32-arduino-libs-20260807-031549.tar.gz
framework = arduino
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ES3C28P>
build_flags =
	${env.build_flags}
	-Iboards/ES3C28P
	-UCORE_DEBUG_LEVEL
	-DCORE_DEBUG_LEVEL=5
	-DDEVICE_NAME='"ES3C28P"'
	-DOTA_TAG='"ES3C28P"'
	-DES3C28P=1
	-DDONT_USE_INPUT_TASK=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DROTATION=1
	-DHAS_BTN=1
	-DSEL_BTN=0
	-DUP_BTN=-1
	-DDW_BTN=-1
	-DBTN_ACT=LOW
	-DBTN_ALIAS='"Boot"'

	-DFP=1
	-DFM=2
	-DFG=3

	-DHAS_TOUCH=1
	-DILI9341_DRIVER=1
	-DTFT_INVERSION_ON=1
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_RST=-1
	-DTFT_BL=45
	-DTOUCH_CS=-1

	-D GFX_BL=45
	-D TFT_IPS=0
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0


	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000
	-DMINBRIGHT=1


	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_FT6336=1
	-DTOUCH_SDA=16
	-DTOUCH_SCL=15
	-DTOUCH_RST=18
	-DTOUCH_INT=17


	-DBOARD_HAS_TF=1
	-DUSE_SD_MMC=1
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=38
	-DPIN_SD_CMD=40
	-DPIN_SD_D0=39
	-DPIN_SD_D1=41
	-DPIN_SD_D2=48
	-DPIN_SD_D3=47

	-DANALOG_BAT_PIN=9


	-DRGB_LED_PIN=42


	-DAUDIO_EN_PIN=1
	-DI2S_MCK=4
	-DI2S_SCK=5
	-DI2S_DO=6
	-DI2S_LRC=7
	-DI2S_DI=8

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit NeoPixel @ ^1.12.3

lib_ignore =
	SensorLib
	XPowersLib
