; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Seeed Studio reTerminal E1001.
;
; ESP32-S3 (8 MB octal PSRAM, 32 MB flash), 800x480 e-paper (UC8179, same
; command family as GxEPD2's GDEY075T7 class), 3 physical nav buttons, no
; touch, microSD sharing the e-paper's SPI bus (SCLK/MOSI only -- the panel
; is write-only and has no MISO of its own).
;
; Pins from Seeed's own GxEPD2 example:
;   https://github.com/Seeed-Projects/Seeed_GxEPD2/blob/1100ea37c16b910fd79152f4250c13d802b9c20b/examples/GxEPD2_reTerminal_E1001/GxEPD2_reTerminal_E1001.ino
; Buttons and SD pinout supplied directly by the person porting this board.
; Not yet bench-tested -- see interface.cpp and connections.md for what is
; assumed vs. confirmed.

[env:seeedstudio-reterminal-e1001]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/seeedstudio-reterminal-e1001>

build_flags =
	${env.build_flags}
	-D BOARD_HAS_PSRAM=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D DISABLE_MASS_STORAGE=1

	# Device information
	-D DEVICE_NAME='"reTerminal E1001"'
	-D OTA_TAG='"seeedstudio-reterminal-e1001"' # This tag must be added into the OTA Backend

	# Flags to increase the font sizes, increasing UI icons and texts
	-D FP=2
	-D FM=3
	-D FG=5

	# Native landscape 800x480 panel, buttons on the top edge -- unlike the
	# reterminal-sticky's portrait glass this one is not known to need a
	# rotation. Unconfirmed on hardware; revisit if the boot screen comes up
	# sideways.
	-D ROTATION=0
	-D DIMMER_SETUP=0 # e-paper, no backlight to dim

	# 3 raw GPIO buttons -- Sel/Next/Prev, Next+Prev also raises Esc
	# (hal_buttons_poll_3 standard combo).
	-D HAS_3_BUTTON=1
	-DLAUNCHER_GPIO_KEYS='{{"Sel", 3}, {"Next", 4}, {"Prev", 5}}' # Choose among available GPIO to start Launcher when booting

	-D USE_GXEPD2=1
	-D E_PAPER_DISPLAY=1

	-D TFT_WIDTH=800
	-D TFT_HEIGHT=480

	# Same UC8179-family panel as Seeed's own GxEPD2 example.
	-D GXEPD2_PANEL=GxEPD2_750_GDEY075T7
	-D GXEPD2_FULL_REFRESH_INTERVAL=30

	-D TFT_SCLK=7
	-D TFT_MOSI=9
	-D TFT_CS=10
	-D TFT_DC=11
	-D TFT_RST=12
	-D TFT_BUSY=13
	# Not GXEPD2_BEGIN_SPI: the SD card shares SCLK/MOSI (its own CS and
	# MISO), so interface.cpp brings SPI up itself with both CS pins already
	# parked high -- see _setup_gpio().

	# SD card shares the e-paper's SCLK/MOSI; CS and MISO are its own.
	-D SDCARD_CS=14
	-D SDCARD_SCK=7
	-D SDCARD_MOSI=9
	-D SDCARD_MISO=8

	# Battery voltage divider (mykeyboard.cpp's weak getBattery()), 2x
	# multiplier is already this function's default. GPIO21 is the divider's
	# enable gate, driven HIGH once at boot in interface.cpp -- see Seeed's
	# own example:
	# https://github.com/Seeed-Projects/OSHW-reTerminal-Series-E-D/blob/main/examples/base/Battery_Monitor/Battery_Monitor.ino
	-D ANALOG_BAT_PIN=1

lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4

lib_ignore =
	XPowersLib
	GFX Library for Arduino
