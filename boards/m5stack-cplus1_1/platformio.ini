; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cplus1_1]
board = m5stack-cplus1_1
board_build.partitions = support_files/custom_4Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus1_1>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"M5Stack StickCPlus"'
	-DOTA_TAG='"stickc"'
	-DOTA_EXTRA='"esp=32"'

	-DHAS_3_BUTTONS

	-DUSE_CARDKB2=1
	-DCARDKB2_SDA=32
	-DCARDKB2_SCL=33

	-DROTATION=3

	-DHAS_SCREEN=1

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=1  # Arduino_ST7789
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=5
	-DTFT_DC=23
	-DTFT_RST=18
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=-1

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=14
	-DSDCARD_SCK=0
	-DSDCARD_MISO=36
	-DSDCARD_MOSI=26

lib_ignore =
	SensorLib
	XPowersLib

[env:m5stack-c]
board = m5stick-c
board_build.partitions = support_files/custom_4Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus1_1>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"M5Stack StickC"'
	-DOTA_TAG='"stickc"'
	-DOTA_EXTRA='"esp=32"'
	-DHAS_3_BUTTONS

	-DUSE_CARDKB2=1
	-DCARDKB2_SDA=32
	-DCARDKB2_SCL=33

	-DROTATION=3

	# This board is using an especific setup for the 7735 display
	-DUSE_TFT_ESPI

	-DFP=1
	-DFM=1
	-DFG=2

	-DTFT_WIDTH=80
	-DTFT_HEIGHT=160

	-DSDCARD_CS=14
	-DSDCARD_SCK=0
	-DSDCARD_MISO=36
	-DSDCARD_MOSI=26

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/TFT_eSPI#StickC

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

