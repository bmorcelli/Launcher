; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; M5Stack StickC and StickC Plus in one binary.
;
; Same ESP32-PICO-D4, same AXP192, same buttons, same SD pinout, same LCD pins.
; The only difference is the glass:
;
;   StickC       ST7735S   80x160    window 26/1 into 132x162 of RAM, mounted
;                                    180 degrees round from the Plus
;   StickC Plus  ST7789   135x240    window 52/40
;
; What follows seeds the Plus. interface.cpp reads the panel's ID register in
; _setup_gpio() -- 0x7C is the ST7735S -- and rewrites displayConfig, the text
; sizes and device_name before tft->begin() builds anything from them. Both
; drivers are compiled in; the ST7735 costs about 1.1 kB.
;
; The StickC's panel also needs a power/frame-rate block that Arduino_ST7735's
; single hardcoded init table does not carry. interface.cpp sends it from
; _post_setup_gpio(); see the comment there.
[env:m5stack-plus]
board = esp32
board_build.f_flash = 80000000L
board_build.partitions = support_files/custom_4Mb.csv
board_upload.speed = 1500000
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus1_1>
build_flags =
	${env.build_flags}
	-DM5STACK

	-DDEVICE_NAME='"M5Stack StickCPlus"'
	-DOTA_TAG='"stickc"'
	-DOTA_EXTRA='"esp=32"'

	-DHAS_3_BUTTONS
	-DLAUNCHER_GPIO_KEYS='{37, 39}' # Choose among available GPIO to start Launcher when booting

	-DUSE_CARDKB2=1
	-DCARDKB2_SDA=32
	-DCARDKB2_SCL=33

	-DROTATION=3

	-DHAS_SCREEN=1

	-D TFT_DATABUS_N=0             # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=1      # Arduino_ST7789 -- StickC Plus, the seeded default
	-D TFT_DISPLAY_DRIVER_N_ALT1=0 # Arduino_ST7735 -- StickC, chosen by the boot probe
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=5
	-DTFT_DC=23
	-DTFT_RST=18
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=-1

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=14
	-DSDCARD_SCK=0
	-DSDCARD_MISO=36
	-DSDCARD_MOSI=26

lib_ignore =
	SensorLib
	XPowersLib
