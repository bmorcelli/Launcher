##################################### Waveshare ESP32-C5-Touch-LCD-3.5 (ESP32-C5 + 3.5" ST7796 + FT6336 cap touch) ####################################################
; Hardware twin of the Pancake C5 (same ESP32-C5 + ST7796 320x480 + FT6336), but
; the panel reset and backlight are NOT GPIOs: a CH32V006 I/O expander at 0x24 on
; the shared I2C bus owns panel power, the LCD reset, the FT6336 reset and the
; backlight PWM. Pin map is from the ESP32-C5-BSP (hardware-verified).
[env:waveshare-esp32-c5-touch-lcd-35]
board = esp32c5
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-esp32-c5-touch-lcd-35>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1


	-DDEVICE_NAME='"Waveshare C5 3.5"'
	-DOTA_TAG='"waveshare-esp32-c5-touch-lcd-35"'

	-DROTATION=0

	; TFT — ST7796 3.5" 320x480, shared SPI bus with SD card.
	; Reset is EXIO1 and backlight is the PWM register on the 0x24 expander,
	; so TFT_RST / TFT_BL are -1 and both are driven from interface.cpp.
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_FT6X36=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=2  # Arduino_ST7796
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_INVERSION_ON=1
	-DTFT_MISO=2
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=8
	-DTFT_DC=5
	-DTFT_RST=-1   # ST7796 reset = EXIO1 on the 0x24 expander (no GPIO)
	-DTFT_BL=-1    # backlight = expander PWM register (no GPIO)
	-DTOUCH_CS=-1
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	; Backlight PWM (driven via the expander in interface.cpp)
	-DDIMMER_SETUP=60

	; SD card — shares the SPI bus with the TFT (raise LCD CS before mount)
	-DSDCARD_CS=9
	-DSDCARD_SCK=TFT_SCLK
	-DSDCARD_MISO=TFT_MISO
	-DSDCARD_MOSI=TFT_MOSI

lib_ignore =
	XPowersLib
