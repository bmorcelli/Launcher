; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cardputer]
board = m5stack-cardputer
board_build.partitions = support_files/custom_8Mb.csv
# board_build.partitions = support_files/custom_8Mb2.csv # debug
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cardputer>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"M5Stack Cardputer & ADV"'
	-DOTA_TAG='"cardputer"'

	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000
	-D HAS_KEYBOARD=1
	'-DRESERVED_NAV_KEYS=",\;/\`."'

	-DROTATION=1

	-DANALOG_BAT_PIN=10

	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.1

lib_ignore =
	SensorLib
	XPowersLib
