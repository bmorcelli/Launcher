; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

######################## Seeed Studio XIAO 1.47" Touch Display (ESP32-S3) #####################
; A display board for the XIAO series, sold mated to a XIAO ESP32-S3 Plus
; (ESP32-S3R8: 16MB flash, 8MB octal PSRAM) -- the generic esp32s3 JSON already
; matches that module (16MB / qio_opi / 80MHz), so only the partition table is
; overridden here.
;
; Panel is a JD9853A 172x320 IPS on SPI, BGR, driven as an ST7796 -- see
; connections.md for why, and for the full pin table / what is still unverified
; on hardware.
;
; https://wiki.seeedstudio.com/getting_started_1.47_inch_touch_display_esp32s3/
[env:seeedstudio-esp32s3-touch-147]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 921600

build_src_filter =${env.build_src_filter} +<../boards/seeedstudio-esp32s3-touch-147>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-D DEVICE_NAME='"Seeed XIAO 1.47 Touch"'
	-D OTA_TAG='"seeedstudio_esp32s3_touch_147"'
	-D OTA_EXTRA='"esp=S3"'
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000

	# This glass needs Arduino_GFX's MX-based rotation family (4-7); the plain
	# 0-3 family comes up mirrored on it. ROT_OFFSET shifts the whole family,
	# including the values the rotation menu offers, so ROTATION stays the 0-3
	# index inside it: 3 + 4 = 7, MADCTL = MV|BGR (0x28), landscape 320x172
	# with the 34px offset on RASET. See connections.md.
	-D ROTATION=3
	-D ROT_OFFSET=4
	-D DIMMER_SETUP=20

	# 2-pin JST LiPo sensed on the XIAO's own ADC_BAT (GPIO10) through a
	# 316K/160K divider: (316+160)/160 = 2.975
	-D ANALOG_BAT_PIN=10
	-D ANALOG_BAT_MULTIPLIER=2.975f

	-D HAS_2_BUTTONS=1
	-D BUTTONS_IDF_COMPONENT=1
	-D HAS_TOUCH=1
	-D TOUCH_CTRL_AXS5106L=1

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	# Arduino_ST7796, not Arduino_ST7789: this glass needs the BGR bit in
	# MADCTL, and only the ST7796 driver sets it. Its init table is one of the
	# two Seeed documents as known-working on the JD9853A.
	-D TFT_DISPLAY_DRIVER_N=2
	-D TFT_WIDTH=172
	-D TFT_HEIGHT=320
	-D TFT_CS=3
	-D TFT_DC=4
	-D TFT_RST=13   # shared with the touch controller's RST
	-D TFT_MISO=8   # not used by the panel, shared bus with the SD card
	-D TFT_MOSI=9
	-D TFT_SCLK=7
	-D TFT_BL=12
	-D TFT_IPS=0    # JD9853A glass reads normal with inversion OFF
	# 172 of a 240-wide controller RAM, centred: (240-172)/2 = 34. OFS1 is used
	# at rotation 0/4, OFS2 at 1/2/3/5, and ROW_OFS1/COL_OFS1 again at 6/7.
	-D TFT_COL_OFS1=34
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=34
	-D TFT_ROW_OFS2=0
	-D TFT_PREF_SPEED=40000000

	# microSD shares the panel's SPI bus; TFT_MOSI == SDCARD_MOSI makes
	# sd_functions.cpp mount it on the already-initialized global SPI.
	-D SDCARD_CS=43
	-D SDCARD_SCK=7
	-D SDCARD_MISO=8
	-D SDCARD_MOSI=9

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button
