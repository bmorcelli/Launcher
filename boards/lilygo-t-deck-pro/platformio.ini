; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t-deck-pro]
board = lilygo-t-deck-pro
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-deck-pro>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"Lilygo T-Deck Pro"'
	-DOTA_TAG='"t-deck-pro"'
	-DE_PAPER_DISPLAY=1

	-DRESERVED_NAV_KEYS='"wasd"' # Up/Down/Prev/Next — see interface.cpp InputHandler
    -DROTATION=0 # 0,2 Portrait, 1,3 to landscape

	-DHAS_TOUCH=1
	-DHAS_KEYBOARD=1

	-DTFT_MOSI=33
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320

	-DSDCARD_CS=48
	-DSDCARD_SCK=36
	-DSDCARD_MOSI=33
	-DSDCARD_MISO=47

lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4
	adafruit/Adafruit TCA8418 @ ^1.0.2

lib_ignore =
	GFX Library for Arduino
