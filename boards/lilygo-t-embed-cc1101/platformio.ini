; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

#################################### EStart OF LILYGO MODELS #######################################
[env:lilygo-t-embed]
board = lilygo-t-embed
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Lilygo T-Embed"'
	-DOTA_TAG='"t-embed"'

	-DHAS_ENCODER=1

	-DROTATION=3

	-DANALOG_BAT_PIN=4

	-DUSE_TFT_ESPI
	;TFT_eSPI display
	-DST7789_DRIVER=1
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DSMOOTH_FONT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=15
	-DTFT_MISO=-1
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=13
	-DTFT_RST=9
	-DTOUCH_CS=-1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	-DSDCARD_CS=39
	-DSDCARD_SCK=40
	-DSDCARD_MISO=38
	-DSDCARD_MOSI=41

	-DTFT_BRIGHT_FREQ=10000

lib_deps =
	${env.lib_deps}
	mathertel/RotaryEncoder @1.5.3
	Bodmer/TFT_eSPI @ 2.5.43
lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

[env:lilygo-t-embed-cc1101]
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'
	-DOTA_TAG='"t-embed-cc1101"'

	-DROTATION=0
	-DHAS_ENCODER=1

	-DST7789_DRIVER=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DTFT_MISO=10
	-DTFT_MOSI=9
	-DTFT_SCLK=11
	-DTFT_CS=41
	-DTFT_DC=16
	-DTFT_RST=-1

	-D TFT_IPS=1
	-D TFT_COL_OFS1=35
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=35
	-D TFT_ROW_OFS2=0

	-DSDCARD_CS=13
	-DSDCARD_SCK=11
	-DSDCARD_MISO=10
	-DSDCARD_MOSI=9

	-DTFT_BRIGHT_FREQ=10000

lib_deps =
	${env.lib_deps}
	mathertel/RotaryEncoder @1.5.3

lib_ignore =
	SensorLib
