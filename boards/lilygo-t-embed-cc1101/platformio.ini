;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Lilygo T-Embed and T-Embed CC1101 in one binary.
;
; Same ESP32-S3, same 16 MB of octal PSRAM, same encoder-and-a-button layout,
; same 170x320 ST7789. What differs is where everything is wired, and what the
; CC1101 board adds on top:
;
;                    T-Embed        T-Embed CC1101
;   LCD  CS/DC/RST   10/13/9        41/16/-1
;   LCD  SCLK/MOSI   12/11          11/9
;   backlight        15             21
;   SD   CS/SCK/     39/40/         13/11/
;        MISO/MOSI   38/41          10/9
;   power enable     46             15
;   encoder A/B      2/1            4/5
;   back button      --             6
;   battery          ADC on 4       BQ27220 fuel gauge on I2C
;   charger          --             BQ25896 on I2C
;   radios           --             CC1101, nRF24, switched antenna
;
; What follows seeds the CC1101. interface.cpp probes I2C in _setup_gpio(): the
; BQ25896 charger answers on a CC1101 board and nothing answers on a plain one,
; and the two boards put I2C on the same pins, so the probe is safe either way.
; On a plain T-Embed it rewrites displayConfig, the SD pins, the button and
; encoder pins, device_name and ota_tag before anything is built from them.
;
; The panel itself is the same driver and the same geometry on both, so there is
; no _ALT driver here -- only pins move.
[env:lilygo-t-embed-all]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'
	-DOTA_TAG='"t-embed-cc1101"'

	-DROTATION=3
	-DHAS_ENCODER=1

	-DPMIC_BQ25896=1
	-DGAUGE_BQ27220=1

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=1  # Arduino_ST7789
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=21
	-DTFT_MISO=10
	-DTFT_MOSI=9
	-DTFT_SCLK=11
	-DTFT_CS=41
	-DTFT_DC=16
	-DTFT_RST=-1

	-D TFT_IPS=1
	-D TFT_COL_OFS1=35
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=35
	-D TFT_ROW_OFS2=0

	-DSDCARD_CS=13
	-DSDCARD_SCK=11
	-DSDCARD_MISO=10
	-DSDCARD_MOSI=9

	-DTFT_BRIGHT_FREQ=10000

lib_deps =
	${env.lib_deps}
	mathertel/RotaryEncoder @1.5.3

lib_ignore =
	SensorLib
