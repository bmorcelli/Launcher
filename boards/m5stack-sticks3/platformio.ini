; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-sticks3]
board = esp32s3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = support_files/custom_8Mb2.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-sticks3>
build_flags =
	${env.build_flags}
	-DM5STACK
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"M5Stack StickS3"'
	-DOTA_TAG='"stickc"'
	-DOTA_EXTRA='"esp=S3"'

	-DUSE_CARDKB2=1
	-DCARDKB2_SDA=9
	-DCARDKB2_SCL=10

	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x2F0000

	-DROTATION=3
	-DHAS_1_BUTTON=1

	-DUSE_M5GFX=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=41
	-DTFT_DC=45
	-DTFT_RST=21
	-DTFT_MOSI=39
	-DTFT_SCLK=40
	-DTFT_MISO=-1
	-DTFT_BL=38

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=7
	-DSDCARD_SCK=5
	-DSDCARD_MISO=4
	-DSDCARD_MOSI=6

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

