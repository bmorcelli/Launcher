; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-dinmeter]
board = m5stack-dinmeter
board_build.partitions = support_files/custom_8Mb2.csv
build_src_filter =${env.build_src_filter} +<../boards/m5stack-dinmeter>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"M5Stack DinMeter"'
	-DOTA_TAG='"dinmeter"'

	-D HAS_ENCODER=1
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x2F0000
	-DROTATION=3

	-DUSE_M5GFX=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=7
	-DTFT_DC=4
	-DTFT_RST=8
	-DTFT_MOSI=5
	-DTFT_SCLK=6
	-DTFT_MISO=-1
	-DTFT_BL=9

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=13
	-DSDCARD_SCK=15
	-DSDCARD_MISO=2
	-DSDCARD_MOSI=1

build_unflags =
	-DBOARD_HAS_PSRAM

lib_deps =
	${env.lib_deps}
	mathertel/RotaryEncoder @1.5.3
	m5stack/M5Unified @ ^0.2.17

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

