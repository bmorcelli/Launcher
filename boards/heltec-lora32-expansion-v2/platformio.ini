[env:heltec-lora32-expansion-v2]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 460800
build_src_filter = ${env.build_src_filter} +<../boards/heltec-lora32-expansion-v2>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_NAME='"Heltec LoRa 32 Expansion V2"'
    -D OTA_TAG='"heltec_lora32_expansion_v2"'
    -D OTA_EXTRA='"esp=S3"'
    -D LAUNCHER_GPIO_KEYS='{{"IO", 46}}'
    -D HAS_2_BUTTONS=1
    -D BUTTONS_IDF_COMPONENT=1
    -D HAS_TOUCH=1
    -D ROTATION=1
    -D ANALOG_BAT_PIN=1
    -D ANALOG_BAT_MULTIPLIER=4.9f

    -D TFT_DATABUS_N=0
    -D TFT_DISPLAY_DRIVER_N=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_CS=47
    -D TFT_DC=48
    -D TFT_RST=21
    -D TFT_SCLK=16
    -D TFT_MOSI=15
    -D TFT_MISO=45
    -D TFT_BL=44
    -D TFT_IPS=1
    -D TFT_COL_OFS1=0
    -D TFT_COL_OFS2=0
    -D TFT_ROW_OFS1=0
    -D TFT_ROW_OFS2=0
    -D TFT_PREF_SPEED=40000000

    -D SDCARD_CS=3
    -D SDCARD_SCK=16
    -D SDCARD_MOSI=15
    -D SDCARD_MISO=45

lib_deps =
    https://github.com/bmorcelli/ESP32_Button
