; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:elecrow-esp32p4-7in]
board = esp32p4_es
board_build.partitions = support_files/custom_16Mb_p4.csv
monitor_dtr = 0
monitor_rts = 0
build_src_filter =${env.build_src_filter} +<../boards/elecrow-esp32p4-7in>
extra_scripts =
	${env.extra_scripts}
	pre:support_files/patch_hosted_sdio_freq.py
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0

	-DENABLE_ESP_AT_INTERFACE=1

	-DDEVICE_NAME='"Elecrow CrowPanel Advanced 7in P4"'
	-DOTA_TAG='"elecrow-esp32p4-7in"'

	-DROTATION=1
	-DHAS_TOUCH=1
	-DDIMMER_SETUP=60
	-DFP=3
	-DFM=5
	-DFG=7

	# WiFi/BT comes from an onboard ESP32-C6 module bridged over SDIO, same
	# scheme as m5stack-tab5 / lilygo-t-display-p4. CLK=GPIO18, CMD=GPIO19, and
	# the C6's own enable/reset (C6_EN)=GPIO32 match the schematic (ESP32-P4
	# Display 7.0 inch V1.2.sch), but the D0-D3 order printed there
	# (17,16,15,14) does not actually work - confirmed on real hardware (WiFi
	# scan + AP connect via the ESP-Hosted co-processor) with D0..D3 in the
	# reverse order below instead. If a different board revision needs the
	# schematic's order after all, override at runtime with e.g.
	# `sdio set 18 19 17 16 15 14 32` (see the "sdio" serial console command)
	# rather than rebuilding.
	-D SDIO2_CLK=GPIO_NUM_18
	-D SDIO2_CMD=GPIO_NUM_19
	-D SDIO2_D0=GPIO_NUM_14
	-D SDIO2_D1=GPIO_NUM_15
	-D SDIO2_D2=GPIO_NUM_16
	-D SDIO2_D3=GPIO_NUM_17
	-D SDIO2_RST=GPIO_NUM_32
	# ESP-Hosted's default SDIO clock (40 MHz, CONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ in
	# the prebuilt esp32-arduino-libs) causes intermittent CRC errors
	# ("sdmmc_io_rw_extended ... returned 0x109" / "H_SDIO_DRV: sdio_get_tx_buffer_num:
	# err: 265") on this board's SDIO2 wiring - confirmed on real hardware. Halved via
	# support_files/patch_hosted_sdio_freq.py, which patches the one line in Arduino's
	# esp32-hal-hosted.c that builds the SDIO config (no public runtime API exposes
	# just the frequency - only pins, via hostedSetPins()).
	-D LAUNCHER_HOSTED_SDIO_FREQ_KHZ=20000

	# Display: EK79007 MIPI-DSI panel, 1024x600, 2 data lanes, driven over
	# Arduino_ESP32DSIPanel. Pins/timings per Elecrow's esp_panel_board_custom_conf.h
	# for this model (ESP32_Display_Panel example).
	-DTFT_DATABUS_N=4   # Arduino_ESP32DSIPanel
	-DTFT_DISPLAY_DRIVER_N=50 # Arduino_DSI_Display
	-DTFT_WIDTH=1024
	-DTFT_HEIGHT=600
	-DTFT_RST=41
	-DTFT_HSYNC_PULSE_WIDTH=10
	-DTFT_HSYNC_BACK_PORCH=160
	-DTFT_HSYNC_FRONT_PORCH=160
	-DTFT_VSYNC_PULSE_WIDTH=1
	-DTFT_VSYNC_BACK_PORCH=23
	-DTFT_VSYNC_FRONT_PORCH=12
	-DTFT_PREF_SPEED=52000000
	-DTFT_DSI_LANE_BIT_RATE=1000
	-DTFT_DSI_INIT=ek79007_init_operations
	-DTFT_BL=31
	-DTFT_BL_POWER=29

	# Touch: GT911, capacitive, I2C. Wired directly to the P4 (no IO expander
	# on this model, unlike the ESP32-S3 CrowPanel boards).
	-DTOUCH_GT911_I2C=1
	-DGT911_I2C_CONFIG_SDA_IO_NUM=45
	-DGT911_I2C_CONFIG_SCL_IO_NUM=46
	-DGT911_TOUCH_CONFIG_RST_GPIO_NUM=40
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=42

	-DUSE_SD_MMC=1
	-D SDM=SD_MMC
	-DPIN_SD_CLK=43
	-DPIN_SD_CMD=44
	-DPIN_SD_D0=39
	-D BOARD_SDMMC_SLOT=0
	-D BOARD_HAS_SDMMC=1
	-D BOARD_SDMMC_POWER_CHANNEL=4

	# The board's second USB-C port (the one NOT wired through the CH340 used
	# for flashing/console) goes straight to the ESP32-P4's dedicated DM/DP
	# pins per the schematic -- the same "own UTMI PHY, fixed pads" high-speed
	# OTG controller lilygo-t-display-p4's "High Speed USB" port uses (see
	# massStorage.cpp's rhport 0 vs 1 comment). UNVERIFIED: this port was not
	# connected to a host to test against: if USB mass storage doesn't
	# enumerate, this is the first thing to question.
	-D USB_MSC_HIGH_SPEED=1

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib
	https://github.com/bmorcelli/Arduino_GFX#ek79007_display

lib_ignore =
	SensorLib
	XPowersLib
