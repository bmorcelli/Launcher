; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/platformio.ini/page/projectconf.html

##################### lcdwiki-es3c35p (ESP32-S3 + 3.5" ST77922 QSPI + built-in cap touch) ####################
; 3.5" ESP32-S3 IPS LCD Display Module, 320x480, quad-SPI (no DC pin) ST77922
; panel, sold rebadged as "Hosyond ESP32-S3 Touchscreen Module 3.5"" (Amazon
; B0H28X8SQ4) among others. Sibling of ES3C28P (2.8", standard 4-wire SPI) --
; see boards/ES3C28P for that board's config, most of which this one mirrors.
; https://www.lcdwiki.com/3.5inch_ESP32-S3_Display
;
; The panel is driven by Arduino_ST77922_1L4 (TFT_DATABUS_N=6 /
; TFT_DISPLAY_DRIVER_N=52, lib/DisplayDrivers/src/panels/Arduino_ST77922_1L4.h),
; and the built-in touch block by TOUCH_CTRL_ST77922 (src/hal/inputs/touch.cpp).
; Tested on hardware: display, touch, SD, all four rotations, battery sense,
; Turn-off / wake. See connections.md.
[env:lcdwiki-es3c35p]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lcdwiki-es3c35p>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DDEVICE_NAME='"lcdwiki-es3c35p"'
	-DOTA_TAG='"lcdwiki_es3c35p"'

	; Panel native size is 320x480 portrait; ROTATION=1 is the confirmed
	; landscape mounting (see Arduino_ST77922_1L4.h's rotation-transform note).
	-DROTATION=1

	-DHAS_TOUCH=1
	-DTOUCH_CTRL_ST77922=1 # self-contained driver in src/hal/inputs/touch.cpp (NOT FT6x36-compatible)
	; TFT -- ST77922 320x480 over QSPI, no DC pin. This is NOT the same bus
	; as ES3C28P's Arduino_HWSPI (0): this panel's command phase is a single
	; QSPI line while its data phase is 4, which Arduino_GFX's own QSPI bus
	; (TFT_DATABUS_N=1) cannot do -- see Arduino_ST77922_1L4.h.
	; Draw into a full-screen PSRAM canvas and flush it in one transfer. Without
	; it every pixel is its own SPI transaction (~20 s to paint the boot screen).
	; The canvas also owns rotation, which suits a panel that can't rotate itself.
	-DUSE_CANVAS=1
	-D TFT_DATABUS_N=6         # Arduino_ST77922_1L4 (QSPI, single-line command phase)
	-D TFT_DISPLAY_DRIVER_N=52 # Arduino_ST77922_1L4
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	; QSPI has no DC pin, but defining TFT_DC (even as -1) is what stops
	; include/pre_compiler.h's "CYD defaults" block from overriding TFT_CS/TFT_SCLK
	; below with 15/14 -- it fires when none of TFT_DC/TFT_IPS/TFT_COL_OFS*/TFT_MOSI is set.
	-DTFT_DC=-1
	-DTFT_IPS=0
	-DTFT_CS=10
	-DTFT_SCLK=12
	-DTFT_D0=11
	-DTFT_D1=13
	-DTFT_D2=14
	-DTFT_D3=9
	-DTFT_RST=-1  ; no reset pin -- RST is tied to CHIP_PU on this board (see connections.md)
	-DTFT_BL=41

	; Backlight PWM (TFT_BRIGHT_CHANNEL/Bits/FREQ come from pre_compiler.h)
	-DDIMMER_SETUP=20

	; Capacitive touch -- built into the ST77922 itself, I2C 0x55 with a 16-bit
	; register map; shared I2C bus with the ES8311 codec.
	-DTOUCH_SDA=38
	-DTOUCH_SCL=39
	-DTOUCH_RST=48
	-DTOUCH_INT=47

	; SD card -- native 4-bit SDIO, not shared with anything else on this board.
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DSD_MMC_4BIT=1
	-DPIN_SD_CLK=5
	-DPIN_SD_CMD=4
	-DPIN_SD_D0=6
	-DPIN_SD_D1=7
	-DPIN_SD_D2=2
	-DPIN_SD_D3=3

	; WS2812 status LED, driven by the core's neopixelWrite() -- no extra library
	-DRGB_LED_PIN=40

	; SC8002B audio amplifier shutdown line (active LOW). Held off at boot;
	; the I2S pins are unused by the launcher.
	-DAUDIO_EN_PIN=1

	; Battery sense: GPIO 8 reads ~2.0 V with a ~4.0 V LiPo attached, i.e. a 1:2
	; divider (Launcher's default ANALOG_BAT_MULTIPLIER of 2.0 applies). Found by an
	; ADC scan and confirmed against a multimeter (see connections.md).
	-DANALOG_BAT_PIN=8

lib_ignore =
	XPowersLib
