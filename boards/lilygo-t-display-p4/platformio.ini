; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t-display-p4]
board = esp32p4_es
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = support_files/custom_16Mb_p4.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-p4>
build_flags =
	${env.build_flags}
	# Board memory and USB, used to live in the board JSON's extra_flags
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0

	-DDEVICE_NAME='"Lilygo T-Display P4"'
	-DOTA_TAG='"t-display-p4"'

	-D ENABLE_ESP_AT_INTERFACE=1

	-DFP=3
	-DFM=5
	-DFG=7

	-D BOARD_HAS_SDIO_ESP_HOSTED
	-D BOARD_SDIO_ESP_HOSTED_CLK=18
	-D BOARD_SDIO_ESP_HOSTED_CMD=19
	-D BOARD_SDIO_ESP_HOSTED_D0=14
	-D BOARD_SDIO_ESP_HOSTED_D1=15
	-D BOARD_SDIO_ESP_HOSTED_D2=16
	-D BOARD_SDIO_ESP_HOSTED_D3=17
	-D BOARD_SDIO_ESP_HOSTED_RESET=54

	# The device-side USB-C is the one silkscreened "High Speed USB", i.e. the P4's USB 2.0
	# OTG high-speed controller (TinyUSB rhport 1, UTMI PHY). The other USB-C only reaches
	# the CH343 UART bridge and carries no USB signals from the P4 at all. Without this,
	# massStorage.cpp brings up the full-speed controller and nothing ever enumerates.
	-D USB_MSC_HIGH_SPEED=1

	-D IIC_1_SDA=7
	-D IIC_1_SCL=8

	# SDIO
	-D SDIO_1_CLK=43
	-D SDIO_1_CMD=44
	-D SDIO_1_D0=39
	-D SDIO_1_D1=40
	-D SDIO_1_D2=41
	-D SDIO_1_D3=42

	-D SDIO2_CLK=GPIO_NUM_18
	-D SDIO2_CMD=GPIO_NUM_19
	-D SDIO2_D0=GPIO_NUM_14
	-D SDIO2_D1=GPIO_NUM_15
	-D SDIO2_D2=GPIO_NUM_16
	-D SDIO2_D3=GPIO_NUM_17
	# Dummy reset pin - see BOARD_SDIO_ESP_HOSTED_RESET above. hostedSetPins()
	# rejects any negative pin, so GPIO_NUM_NC cannot be used here.
	-D SDIO2_RST=GPIO_NUM_33

	# SD
	## SDMMC
	-D SD_SDIO_CLK=SDIO_1_CLK
	-D SD_SDIO_CMD=SDIO_1_CMD
	-D SD_SDIO_D0=SDIO_1_D0
	-D SD_SDIO_D1=SDIO_1_D1
	-D SD_SDIO_D2=SDIO_1_D2
	-D SD_SDIO_D3=SDIO_1_D3
	## SDSPI
	-D SD_SCLK=SDIO_1_CLK
	-D SD_MOSI=SDIO_1_CMD
	-D SD_MISO=SDIO_1_D0
	-D SD_CS=SDIO_1_D3

	-D ESP32C6_SDIO_CLK=SDIO_2_CLK
	-D ESP32C6_SDIO_CMD=SDIO_2_CMD
	-D ESP32C6_SDIO_D0=SDIO_2_D0
	-D ESP32C6_SDIO_D1=SDIO_2_D1
	-D ESP32C6_SDIO_D2=SDIO_2_D2
	-D ESP32C6_SDIO_D3=SDIO_2_D3

	-DHAS_TOUCH=1
	-DHAS_KEYBOARD=1

	;-D USE_CANVAS=1
	-D ROTATION=3
	-D TFT_IPS=1
	-D TFT_COL_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS1=0
	-D TFT_ROW_OFS2=0
	-D TFT_DATABUS_N=4
	-D TFT_DISPLAY_DRIVER_N=50
	-D TFT_RST=-1
	-D TFT_PREF_SPEED=60000000

	# The T-Display P4 ships with either a 540x1168 hi8561 IPS panel or a
	# 568x1232 rm69a10 AMOLED, and one binary drives both. What follows seeds
	# the IPS one; interface.cpp probes I2C in _setup_gpio() and, on an AMOLED
	# unit, rewrites displayConfig - geometry, DSI timings and the init table -
	# before tft->begin() builds anything from it. The AMOLED numbers live next
	# to that probe, not here, because only one set can be macros.
	#
	# The touch controller and the brightness path follow the same probe: HI8561
	# at 0x68 with a PWM backlight on GPIO51, or GT9895 at 0x5D with brightness
	# in the panel's own 0x51 register. Both touch drivers are compiled in.
	-D TFT_WIDTH=540
	-D TFT_HEIGHT=1168
	-D TFT_HSYNC_PULSE_WIDTH=28
	-D TFT_HSYNC_BACK_PORCH=26
	-D TFT_HSYNC_FRONT_PORCH=20
	-D TFT_VSYNC_PULSE_WIDTH=2
	-D TFT_VSYNC_BACK_PORCH=22
	-D TFT_VSYNC_FRONT_PORCH=200
	-D TFT_DSI_INIT=hi8561_init_operations

	;-DUSE_SD_MMC=1
	;-D SDM=SD_MMC
	-D PIN_SD_CLK=SDIO_1_CLK
	-D PIN_SD_CMD=SDIO_1_CMD
	-D PIN_SD_D0=SDIO_1_D0
	-D PIN_SD_D1=SDIO_1_D1
	-D PIN_SD_D2=SDIO_1_D2
	-D PIN_SD_D3=SDIO_1_D3

	-DSDCARD_CS=PIN_SD_D3
	-DSDCARD_SCK=PIN_SD_CLK
	-DSDCARD_MISO=PIN_SD_D0
	-DSDCARD_MOSI=PIN_SD_CMD
	# The LilyGO reference driver mounts this slot 4-bit wide (InitSdmmc():
	# slot_config.width = 4 + SDMMC_SLOT_FLAG_INTERNAL_PULLUP).
	-D SD_MMC_4BIT=1
	# The card is wired to SDMMC slot 0: 43/44/39-42 are exactly the P4
	# SDMMC_SLOT0_IOMUX_PIN_NUM_* pins. Arduino's SD_MMC defaults to slot 1 on
	# the P4 and only honours slot 0 (via IO_MUX) when this is defined, so
	# without it every command times out with 0x107.
	-D BOARD_SDMMC_SLOT=0
	# Required together with BOARD_SDMMC_SLOT: in slot 0 the pins come from
	# IOMUX, so setPins() only validates them and never stores them - the
	# SDMMCFS constructor is what fills _pin_* from SDMMC_SLOT0_IOMUX_PIN_NUM_*,
	# and it only does so when BOARD_HAS_SDMMC is defined. Without this, begin()
	# aborts with "some SD pins are not set".
	-D BOARD_HAS_SDMMC=1
	# On the P4 the SDMMC pads sit in an IO domain fed by the on-chip LDO. With
	# no channel set, SD_MMC logs "use external power for SDMMC" and leaves the
	# rail off. Every P4 variant shipped with the core uses channel 4 (VO4).
	-D BOARD_SDMMC_POWER_CHANNEL=4
