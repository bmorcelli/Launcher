; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Waveshare ESP32-P4-WIFI6-Touch-LCD-5.
;
; ESP32-P4 main SoC + ESP32-C6 co-processor bridged over SDIO (WiFi/BT, same
; scheme as lilygo-t-display-p4/elecrow-esp32p4-7in), 720x1280 portrait
; MIPI-DSI HX8394 panel (2 lanes), GT911 I2C capacitive touch, microSD
; (SDMMC 4-bit, slot 0), 32MB NOR flash, CH343 USB-serial console on the H1
; USB-C and a second USB-C (H2) wired to the P4's own high-speed OTG pads.
;
; Pins and timings come from Waveshare's own schematic, BSP and docs
; (waveshareteam/ESP32-P4-WIFI6-Touch-LCD-5: docs/IO.md, the audited
; esp_lcd_hx8394 driver and examples/arduino/libraries/displays/
; displays_config.h) -- see connections.md for the full table. Verified on a
; P4 rev v1.3 unit: display, touch, microSD, the C6 WiFi bridge and app
; installs from SD all work; the audio codec is not used by this port.

[env:waveshare-esp32-p4-wifi6-touch-lcd-5]
board = esp32p4_es
board_build.partitions = support_files/custom_32Mb_p4.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
monitor_dtr = 0
monitor_rts = 0
build_src_filter =${env.build_src_filter} +<../boards/waveshare-esp32-p4-wifi6-touch-lcd-5>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0

	-DDEVICE_NAME='"Waveshare ESP32-P4-WIFI6-Touch-LCD-5"'
	-DOTA_TAG='"waveshare-esp32-p4-wifi6-touch-lcd-5"'

	# Native panel is 720(w)x1280(h) portrait; the UI is driven in landscape,
	# same convention as the other portrait-glass P4/DSI boards in this repo
	# (lilygo-t-display-p4, seeedstudio-reterminal-d1001). 3 is the value that
	# comes up upright on hardware; use 1 if a different panel revision shows
	# the image upside-down.
	-DROTATION=3
	-DHAS_TOUCH=1
	-DDIMMER_SETUP=60
	-DFP=3
	-DFM=5
	-DFG=7

	# WiFi/BT comes from an onboard ESP32-C6 co-processor bridged over SDIO,
	# same scheme as m5stack-tab5 / lilygo-t-display-p4 / elecrow-esp32p4-7in.
	# CLK=GPIO18, CMD=GPIO19, D0..D3=14..17 (each with its 51K pull-up) and
	# the C6's own enable/reset (GPIO54 through 0R R34) follow Espressif's
	# reference wiring for a P4+C6 pair per the schematic -- unlike Elecrow's
	# board, whose D0..D3 ended up reversed on real hardware. If a revision
	# disagrees, override at runtime with e.g.
	# `sdio set 18 19 14 15 16 17 54` (see the "sdio" serial console command)
	# rather than rebuilding.
	-D SDIO2_CLK=GPIO_NUM_18
	-D SDIO2_CMD=GPIO_NUM_19
	-D SDIO2_D0=GPIO_NUM_14
	-D SDIO2_D1=GPIO_NUM_15
	-D SDIO2_D2=GPIO_NUM_16
	-D SDIO2_D3=GPIO_NUM_17
	-D SDIO2_RST=GPIO_NUM_54

	# Display: HX8394 720x1280 MIPI-DSI panel, 2 data lanes, driven over
	# Arduino_ESP32DSIPanel. Timings per Waveshare's own BSP
	# (HX8394_720_1280_PANEL_30HZ_DPI_CONFIG: 58 MHz DPI clock, 700 Mbps
	# lanes). TFT_DSI_INIT names the stock Arduino_GFX hx8394 table only to
	# satisfy the build-time checks -- that array belongs to a different
	# panel revision -- so interface.cpp re-aims displayConfig at Waveshare's
	# official register sequence in _setup_gpio() (before tft->begin()),
	# following the runtime-swap pattern boards/lilygo-t-display-p4 uses for
	# its AMOLED variant.
	-DTFT_DATABUS_N=4   # Arduino_ESP32DSIPanel
	-DTFT_DISPLAY_DRIVER_N=50 # Arduino_DSI_Display
	-DTFT_WIDTH=720
	-DTFT_HEIGHT=1280
	-DTFT_RST=27
	-DTFT_HSYNC_PULSE_WIDTH=20
	-DTFT_HSYNC_BACK_PORCH=20
	-DTFT_HSYNC_FRONT_PORCH=40
	-DTFT_VSYNC_PULSE_WIDTH=4
	-DTFT_VSYNC_BACK_PORCH=10
	-DTFT_VSYNC_FRONT_PORCH=24
	-DTFT_PREF_SPEED=58000000
	-DTFT_DSI_LANE_BIT_RATE=700
	-DTFT_DSI_INIT=hx8394_init_operations
	# Backlight PWM, AC-coupled into the boost converter's feedback path: a
	# static GPIO level lights nothing, it has to be driven by PWM (hal_bright
	# uses 5 kHz ledc; Waveshare's own BSP drives 5 kHz/10-bit).
	-DTFT_BL=26
	# Backlight boost converter enable (AP3032 EN through 0R R32), active
	# HIGH. Driven once in _setup_gpio() before the PWM starts.
	-DTFT_BL_EN=33

	# Touch: GT911, capacitive, I2C, wired directly to the P4 on the shared
	# board I2C bus (GPIO7/GPIO8, shared with the ES8311/ES7210 audio codec).
	# RST=GPIO23 (0R R37); INT=GPIO2 reaches the touch glass only through an
	# optional 0R (R108, not fitted by default) -- the GT911 latches one of
	# two addresses (0x5D/0x14) and SensorLib's probe tries both, see
	# interface.cpp.
	-DTOUCH_CTRL_GT911=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DGT911_I2C_CONFIG_SDA_IO_NUM=7
	-DGT911_I2C_CONFIG_SCL_IO_NUM=8
	-DGT911_TOUCH_CONFIG_RST_GPIO_NUM=23
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=2

	# microSD: SDMMC 4-bit, slot 0, on the P4's dedicated SDMMC0 pads, fed by
	# the on-chip LDO VO4 -- same wiring and macro set as
	# elecrow-esp32p4-7in. See connections.md for the SDIO1+SDIO2
	# co-existence caveat.
	-DUSE_SD_MMC=1
	-D SDM=SD_MMC
	-DPIN_SD_CLK=43
	-DPIN_SD_CMD=44
	-DPIN_SD_D0=39
	-D BOARD_SDMMC_SLOT=0
	-D BOARD_HAS_SDMMC=1
	-D BOARD_SDMMC_POWER_CHANNEL=4

	# The board's H2 USB-C port (the one NOT wired through the CH343 used
	# for flashing/console) goes straight to the ESP32-P4's dedicated DM/DP
	# pads per the schematic -- the same "own UTMI PHY, fixed pads"
	# high-speed OTG controller lilygo-t-display-p4's "High Speed USB" port
	# uses (see massStorage.cpp's rhport 0 vs 1 comment).
	-D USB_MSC_HIGH_SPEED=1

lib_deps =
	${env.lib_deps}

lib_ignore =
	XPowersLib
