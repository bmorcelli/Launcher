; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-deck]
board = lilygo-t-deck
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-deck>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"Lilygo T-Deck"'
	-DOTA_TAG='"t-deck"'

	-DRESERVED_NAV_KEYS='"wasd"' # Up/Down/Prev/Next — see interface.cpp InputHandler

	-DROTATION=1
	-DANALOG_BAT_PIN=4

	-DHAS_TOUCH=1
	-DHAS_KEYBOARD=1

	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320 ;320
	-DTFT_BL=42
	-DTFT_MISO=38
	-DTFT_MOSI=41
	-DTFT_SCLK=40
	-DTFT_CS=12
	-DTFT_DC=11
	-DTFT_RST=GFX_NOT_DEFINED
	-DTOUCH_CS=-1

	-D TFT_IPS=1
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0


	-DSDCARD_CS=39
	-DSDCARD_SCK=40
	-DSDCARD_MISO=38
	-DSDCARD_MOSI=41

[env:lilygo-t-deck-plus]
extends = env:lilygo-t-deck
build_flags =
	${env:lilygo-t-deck.build_flags}
	-DDEVICE_NAME='"Lilygo T-Deck Plus"'
	-DT_DECK_PLUS=1
