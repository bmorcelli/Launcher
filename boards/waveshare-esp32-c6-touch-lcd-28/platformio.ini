[env:waveshare-esp32-c6-touch-lcd-28]
board = esp32c6
board_build.partitions = support_files/custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-esp32-c6-touch-lcd-28>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"Waveshare ESP32-C6 Touch LCD 2.8"'
	-DOTA_TAG='"waveshare-esp32-c6-touch-lcd-280"'
	-DDISABLE_OTA=1
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_CST8XX=1
	-DROTATION=0
	-DTFT_DATABUS_N=0
	-DTFT_DISPLAY_DRIVER_N=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=8
	-DTFT_MOSI=1
	-DTFT_SCLK=0
	-DTFT_CS=11
	-DTFT_DC=10
	-DTFT_RST=-1
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DTFT_IPS=1
	-DTFT_COL_OFS1=0
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0
	-DSDCARD_CS=23
	-DSDCARD_SCK=0
	-DSDCARD_MISO=8
	-DSDCARD_MOSI=1

lib_ignore =
	XPowersLib
