; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cplus2]
board = m5stack-cplus2
board_build.partitions = support_files/custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus2>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"M5Stack StickCPlus2"'
	-DOTA_TAG='"stickc"'
	-DOTA_EXTRA='"esp=32"'

	-DHAS_3_BUTTONS=1

	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x2F0000

	-DUSE_CARDKB2=1
	-DCARDKB2_SDA=32
	-DCARDKB2_SCL=33

	-DROTATION=3

	-DANALOG_BAT_PIN=38

	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=5
	-DTFT_DC=14
	-DTFT_RST=12
	-DTOUCH_CS=-1
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=27

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=14
	-DSDCARD_SCK=0
	-DSDCARD_MISO=25
	-DSDCARD_MOSI=26

build_unflags =
	-DBOARD_HAS_PSRAM

lib_ignore =
	SensorLib
	XPowersLib
