; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cplus2]
board = esp32
board_build.f_flash = 80000000L
board_build.partitions = support_files/custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.speed = 1500000
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus2>
build_flags =
	${env.build_flags}
	# BOARD_HAS_PSRAM is dropped again by build_unflags below, as it was before.
	-DM5STACK
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	-DDEVICE_NAME='"M5Stack StickCPlus2"'
	-DOTA_TAG='"stickc"'
	-DOTA_EXTRA='"esp=32"'

	-DHAS_3_BUTTONS=1

	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x2F0000

	-DUSE_CARDKB2=1
	-DCARDKB2_SDA=32
	-DCARDKB2_SCL=33

	-DROTATION=3

	-DANALOG_BAT_PIN=38

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=1  # Arduino_ST7789
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=5
	-DTFT_DC=14
	-DTFT_RST=12
	-DTOUCH_CS=-1
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=27

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=14
	-DSDCARD_SCK=0
	-DSDCARD_MISO=25
	-DSDCARD_MOSI=26

lib_ignore =
	SensorLib
	XPowersLib
