; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:arduino-nesso-n1]
board = esp32c6
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/arduino-nesso-n1>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"Arduino Nesso N1"'
	-DOTA_TAG='"arduino%%20nesso%%20n1"'
	-DROTATION=3

	-DHAS_TOUCH=1
	-DHAS_TOUCH_NO_BORDER=1
	-DHAS_2_BUTTONS=1

	-DUSE_M5GFX=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240

	-DSDCARD_CS=15 ; LORA IRQ pin, to avoid Serial SPAM
	-DSDCARD_SCK=2
	-DSDCARD_MISO=6
	-DSDCARD_MOSI=7

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

