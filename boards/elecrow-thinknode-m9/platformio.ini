; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:elecrow-thinknode-m9]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 921600

build_src_filter =${env.build_src_filter} +<../boards/elecrow-thinknode-m9>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	# The USB-C port is wired to a CH340K, not to the ESP32-S3 native USB:
	# the console is UART0 and USB mass storage can never enumerate.
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DDISABLE_MASS_STORAGE=1

	-D DEVICE_NAME='"Elecrow ThinkNode M9"'
	-D OTA_TAG='"elecrow_thinknode_m9"'
	-D OTA_EXTRA='"esp=S3"'
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000

	-D ROTATION=3
	-D DIMMER_SETUP=20
	-D ANALOG_BAT_PIN=13 # 2x divider, the board's only battery sense

	-D HAS_KEYBOARD=1 # keypad coprocessor over I2C, see interface.cpp
	# Bring-up only: logs the raw key register values over UART0. Comment out
	# once the key codes in interface.cpp are confirmed on hardware.
	-D M9_KB_DEBUG=1

	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=1 # Arduino_ST7789
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_CS=16
	-D TFT_DC=15
	-D TFT_RST=14
	-D TFT_MISO=38
	-D TFT_MOSI=47
	-D TFT_SCLK=40
	-D TFT_BL=17 # active LOW, inverted in interface.cpp's _setBrightness()
	-D TOUCH_CS=-1
	-D TFT_IPS=1
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	-D SDCARD_CS=48
	-D SDCARD_SCK=40
	-D SDCARD_MISO=38
	-D SDCARD_MOSI=47
