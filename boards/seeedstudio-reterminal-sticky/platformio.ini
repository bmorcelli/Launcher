; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Seeed Studio reTerminal Sticky.
;
; ESP32-S3, 800x480 e-paper (SSD1677), GT911 touch, BQ25616 PMIC, BQ27220 fuel
; gauge, 3 physical nav buttons, microSD sharing the e-paper's SPI bus.
;
; Pins come from the vendor's hardware overview:
;   https://www.seeedstudio.com/sticky/docs/en/device-guide/hardware-overview/
; None of this has been bench-tested by this project yet — treat the touch
; swap/mirror settings in interface.cpp as a first guess pending confirmation
; on real hardware.

[env:seeedstudio-reterminal-sticky]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.flash_mode = qio
board_upload.speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/seeedstudio-reterminal-sticky>

build_flags =
	${env.build_flags}
	-D BOARD_HAS_PSRAM=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

	# Device information
	-D DEVICE_NAME='"reTerminal Sticky"'
	-D OTA_TAG='"seeedstudio-reterminal-sticky"' # This tag must be added into the OTA Backend

	# Flags to increase the font sizes, increasing UI icons and texts
	-D FP=3
	-D FM=5
	-D FG=7

	# Panel is native 800x480 landscape; rotate to the 480x800 portrait the
	# glass is actually mounted in.
	-D ROTATION=3

	-D HAS_TOUCH=1 # GT911, display the footer bar with btns description
	-D HAS_3_BUTTONS=1

	-D USE_GXEPD2=1
	-D E_PAPER_DISPLAY=1
	-D DIMMER_SETUP=0

	-D TFT_WIDTH=800
	-D TFT_HEIGHT=480

	# Same 800x480 SSD1677 stock GxEPD2 class the Xteink X4 Pro uses.
	-D GXEPD2_PANEL=GxEPD2_426_GDEQ0426T82

	-D TFT_SCLK=13
	-D TFT_MOSI=14
	-D TFT_MISO=12
	-D TFT_CS=15
	-D TFT_DC=16
	-D TFT_RST=17
	-D TFT_BUSY=18
	# Not GXEPD2_BEGIN_SPI: the SD card shares this bus (same SCK/MOSI/MISO,
	# its own CS), so interface.cpp brings SPI up itself with both CS pins
	# already parked high — see _setup_gpio().

	# SD card shares the e-paper's SPI bus; only CS differs.
	-D SDCARD_CS=8
	-D SDCARD_SCK=13
	-D SDCARD_MOSI=14
	-D SDCARD_MISO=12

lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4

lib_ignore =
	XPowersLib
	GFX Library for Arduino
