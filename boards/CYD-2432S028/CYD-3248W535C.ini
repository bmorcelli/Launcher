[env:CYD-3248W535C]
extends = CYDS3_Base

build_flags =
	${CYDS3_Base.build_flags}

	# Generated by custom_flags.py from esp32s3-3248W535N.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32S3_DEV
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D DISABLE_MASS_STORAGE=1

	# Panel geometry and backlight
	-D DISPLAY_WIDTH=320
	-D DISPLAY_HEIGHT=480
	-D GPIO_BCKL=1

	# Input
	-D HAS_TOUCH=1

	# Display: AXS15231B over QSPI
	-D TFT_DATABUS_N=1
	-D TFT_DISPLAY_DRIVER_N=22
	-D TFT_MISO=-1
	-D TFT_MOSI=-1
	-D TFT_D0=21      # AXS15231B_SPI_BUS_DATA0
	-D TFT_D1=48      # AXS15231B_SPI_BUS_DATA1
	-D TFT_D2=40      # AXS15231B_SPI_BUS_DATA2
	-D TFT_D3=39      # AXS15231B_SPI_BUS_DATA3
	-D TFT_SCLK=47    # AXS15231B_SPI_BUS_PCLK
	-D TFT_CS=45      # AXS15231B_SPI_CONFIG_CS
	-D TFT_DC=8       # AXS15231B_SPI_CONFIG_DC
	-D TFT_RST=-1     # AXS15231B_DEV_CONFIG_RESET
	-D TFT_BL=1       # GPIO_BCKL
	-D TFT_WIDTH=320  # DISPLAY_WIDTH
	-D TFT_HEIGHT=480 # DISPLAY_HEIGHT
	-D TFT_IPS=1
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# Touch: AXS15231B (capacitive, I2C, in-panel)
	-D AXS15231B_TOUCH_I2C_SDA=4
	-D AXS15231B_TOUCH_I2C_SCL=8
	-D AXS15231B_TOUCH_I2C_RST=-1
	-D AXS15231B_TOUCH_I2C_IRQ=3

	# SD card
	-D SDCARD_CS=10   # TF_CS
	-D SDCARD_SCK=12  # TF_SPI_SCLK
	-D SDCARD_MISO=13 # TF_SPI_MISO
	-D SDCARD_MOSI=11 # TF_SPI_MOSI

	# Device specific
	-DDEVICE_NAME='"CYD 3248W535C"'
	-DOTA_TAG='"CYD-3248W535C"'
	-DTFT_INVERSION_ON
	-DTOUCH_AXS15231B_I2C
	-DFUTURE # bb_captouch didnt implement it yet
	-DUSE_CANVAS=1
