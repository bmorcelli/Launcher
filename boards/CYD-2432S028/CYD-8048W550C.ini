[env:CYD-8048W550C]
extends = CYDS3_Base
; The manifest asked for these; the generic esp32s3 board does not.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

build_flags =
	${CYDS3_Base.build_flags}

	# Generated by custom_flags.py from esp32s3-8048S550C.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32S3_DEV
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D DISABLE_MASS_STORAGE=1

	# Panel geometry and backlight
	-D DISPLAY_WIDTH=800
	-D DISPLAY_HEIGHT=480
	-D GPIO_BCKL=2

	# Input
	-D HAS_TOUCH=1

	# Display: ST7262 RGB panel
	-D TFT_DATABUS_N=3
	-D TFT_DISPLAY_DRIVER_N=49
	-D TFT_DE=40                # ST7262_PANEL_CONFIG_DE_GPIO_NUM
	-D TFT_VSYNC=41             # ST7262_PANEL_CONFIG_VSYNC_GPIO_NUM
	-D TFT_HSYNC=39             # ST7262_PANEL_CONFIG_HSYNC_GPIO_NUM
	-D TFT_PCLK=42              # ST7262_PANEL_CONFIG_PCLK_GPIO_NUM
	-D TFT_R0=45                # ST7262_PANEL_CONFIG_DATA_GPIO_B0
	-D TFT_R1=48                # ST7262_PANEL_CONFIG_DATA_GPIO_B1
	-D TFT_R2=47                # ST7262_PANEL_CONFIG_DATA_GPIO_B2
	-D TFT_R3=21                # ST7262_PANEL_CONFIG_DATA_GPIO_B3
	-D TFT_R4=14                # ST7262_PANEL_CONFIG_DATA_GPIO_B4
	-D TFT_G0=5                 # ST7262_PANEL_CONFIG_DATA_GPIO_G0
	-D TFT_G1=6                 # ST7262_PANEL_CONFIG_DATA_GPIO_G1
	-D TFT_G2=7                 # ST7262_PANEL_CONFIG_DATA_GPIO_G2
	-D TFT_G3=15                # ST7262_PANEL_CONFIG_DATA_GPIO_G3
	-D TFT_G4=16                # ST7262_PANEL_CONFIG_DATA_GPIO_G4
	-D TFT_G5=4                 # ST7262_PANEL_CONFIG_DATA_GPIO_G5
	-D TFT_B0=8                 # ST7262_PANEL_CONFIG_DATA_GPIO_R0
	-D TFT_B1=3                 # ST7262_PANEL_CONFIG_DATA_GPIO_R1
	-D TFT_B2=46                # ST7262_PANEL_CONFIG_DATA_GPIO_R2
	-D TFT_B3=9                 # ST7262_PANEL_CONFIG_DATA_GPIO_R3
	-D TFT_B4=1                 # ST7262_PANEL_CONFIG_DATA_GPIO_R4
	-D TFT_HSYNC_POL=0
	-D TFT_VSYNC_POL=0
	-D TFT_HSYNC_FRONT_PORCH=8  # ST7262_PANEL_CONFIG_TIMINGS_HSYNC_FRONT_PORCH
	-D TFT_HSYNC_PULSE_WIDTH=4  # ST7262_PANEL_CONFIG_TIMINGS_HSYNC_PULSE_WIDTH
	-D TFT_HSYNC_BACK_PORCH=8   # ST7262_PANEL_CONFIG_TIMINGS_HSYNC_BACK_PORCH
	-D TFT_VSYNC_FRONT_PORCH=8  # ST7262_PANEL_CONFIG_TIMINGS_VSYNC_FRONT_PORCH
	-D TFT_VSYNC_PULSE_WIDTH=4  # ST7262_PANEL_CONFIG_TIMINGS_VSYNC_PULSE_WIDTH
	-D TFT_VSYNC_BACK_PORCH=8   # ST7262_PANEL_CONFIG_TIMINGS_VSYNC_BACK_PORCH
	-D TFT_PCLK_ACTIVE_NEG=true # ST7262_PANEL_CONFIG_TIMINGS_FLAGS_PCLK_ACTIVE_NEG
	-D TFT_PREF_SPEED=16000000
	-D TFT_BL=2                 # GPIO_BCKL
	-D TFT_WIDTH=800            # DISPLAY_WIDTH
	-D TFT_HEIGHT=480           # DISPLAY_HEIGHT
	-D ROTATION=0

	# Touch: GT911 (capacitive, I2C)
	-D TOUCH_GT911_I2C
	-D GT911_I2C_CONFIG_SDA_IO_NUM=19
	-D GT911_I2C_CONFIG_SCL_IO_NUM=20
	-D GT911_TOUCH_CONFIG_RST_GPIO_NUM=38
	-D GT911_TOUCH_CONFIG_INT_GPIO_NUM=18

	# SD card
	-D SDCARD_CS=10             # TF_CS
	-D SDCARD_SCK=12            # TF_SPI_SCLK
	-D SDCARD_MISO=13           # TF_SPI_MISO
	-D SDCARD_MOSI=11           # TF_SPI_MOSI

	# Device specific
	-DDEVICE_NAME='"CYD 8048W550C"'
	-DOTA_TAG='"CYD-8048W550C"'
	-DFG=6
	-DTOUCH_INVERTED=1
