; Same board manifest as the 2432S028; the resistive panel is wired to a
; different set of pins, listed below.
[env:CYD-2432W328R]
extends = CYD_Base
board_build.partitions = support_files/custom_4Mb.csv

build_flags =
	${CYD_Base.build_flags}

	# Generated by custom_flags.py from CYD-2432S028.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32_DEV

	# Input
	-D HAS_TOUCH=1

	# Display: ILI9341 over SPI (CYD default wiring)
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=4
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# SD card
	-D SDCARD_CS=5
	-D SDCARD_SCK=18
	-D SDCARD_MISO=19
	-D SDCARD_MOSI=23

	# Device specific
	-DDEVICE_NAME='"CYD 2432W328R"'
	-DOTA_TAG='"CYD-2432W328R"'
	-D HAS_RESISTIVE_TOUCH=1
	-D TOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-D CYD28_TouchR_IRQ=36
	-D CYD28_TouchR_MISO=12
	-D CYD28_TouchR_MOSI=13
	-D CYD28_TouchR_CLK=14
	-D CYD28_TouchR_CS=33

	; -D CYD28_DISPLAY_HOR_RES_MAX=240
	; -D CYD28_DISPLAY_VER_RES_MAX=320

	-D CYD28_TouchR_ROT=7
	-D CYD28_TouchR_CAL_XMIN=373
	-D CYD28_TouchR_CAL_XMAX=3344
	-D CYD28_TouchR_CAL_YMIN=302
	-D CYD28_TouchR_CAL_YMAX=3471

	-DTFT_INVERSION_ON # TFT is not color inverted
	-DTFT_BL=27 # overrides the 21 above: this model backlights from GPIO27

build_unflags =
	-DDISABLE_OTA
