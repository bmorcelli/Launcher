; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; CYD FAMILY -- SHARED BASES
; ---------------------------------------------------------------------------
; One environment per model, each in its own <env>.ini next to this file, so
; every flag a CYD is built with is visible to IntelliSense.
;
; The panel/touch/SD flags in those files are generated from the board manifests
; in source/ by custom_flags.py -- see custom_flags.md. Those manifests are no
; longer PlatformIO boards: the environments build against the generic esp32 and
; esp32s3 boards in boards/_jsonfiles and describe the hardware themselves.
; ---------------------------------------------------------------------------

[CYD_Base]
board = esp32
board_build.partitions = support_files/custom_4Mb_noOta.csv
build_src_filter =${env.build_src_filter} +<../boards/CYD-2432S028>
build_flags =
	${env.build_flags}
	-DOTA_TAG='"CYD"'
	-DHAS_TOUCH=1
	-DCYD
	-DCYD_RELEASE_SERIAL=1
	-DDISABLE_OTA

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib

lib_ignore =
	SensorLib
	XPowersLib

[CYDS3_Base]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/CYD-2432S028>
build_flags =
	${env.build_flags}
	-DDISABLE_OTA
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCYDS3

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib
	bitbank2/bb_captouch @ ^1.2.2

lib_ignore =
	SensorLib
	XPowersLib
