[env:ESP32-E32R40T]
extends = CYD_Base
board_build.partitions = support_files/custom_4Mb.csv

build_flags =
	${CYD_Base.build_flags}

	# LCDWiki 4.0inch ESP32-32E Display (https://www.lcdwiki.com/4.0inch_ESP32-32E_Display)
	# Wiring matches the Sunton CYD-3248S035R (ST7796 SPI + XPT2046 SPI touch); see custom_flags.md.


	# Panel geometry and backlight
	-D DISPLAY_WIDTH=320
	-D DISPLAY_HEIGHT=480
	-D GPIO_BCKL=27

	# Input
	-D HAS_TOUCH=1

	# Display: ST7796 over SPI
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=2
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=27
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# Touch: XPT2046 (resistive, SPI)
	-D HAS_RESISTIVE_TOUCH=1
	-D TOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-D CYD28_TouchR_IRQ=36
	-D CYD28_TouchR_MISO=12
	-D CYD28_TouchR_MOSI=13
	-D CYD28_TouchR_CLK=14
	-D CYD28_TouchR_CS=33

	-D CYD28_TouchR_ROT=5
	-D CYD28_TouchR_CAL_XMIN=280
	-D CYD28_TouchR_CAL_XMAX=3900
	-D CYD28_TouchR_CAL_YMIN=280
	-D CYD28_TouchR_CAL_YMAX=3900
	-D CYD28_DISPLAY_HOR_RES_MAX=480
	-D CYD28_DISPLAY_VER_RES_MAX=320

	# SD card
	-D SDCARD_CS=5
	-D SDCARD_SCK=18
	-D SDCARD_MISO=19
	-D SDCARD_MOSI=23

	# Device specific
	-DDEVICE_NAME='"ESP32-E32R40T"'
	-DOTA_TAG='"CYD-3248S035R"'
	; -DOTA_TAG='"ESP32-E32R40T"' # Common for CYD-3248S035R

build_unflags =
	-DDISABLE_OTA
