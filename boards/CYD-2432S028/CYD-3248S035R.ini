[env:CYD-3248S035R]
extends = CYD_Base
board_build.partitions = support_files/custom_4Mb.csv

build_flags =
	${CYD_Base.build_flags}

	# Generated by custom_flags.py from esp32-3248S035R.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32_DEV

	# Panel geometry and backlight
	-D DISPLAY_WIDTH=320
	-D DISPLAY_HEIGHT=480
	-D GPIO_BCKL=27

	# Input
	-D HAS_TOUCH=1

	# Display: ST7796 over SPI
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=2
	-D TFT_MISO=12          # ST7796_SPI_BUS_MISO_IO_NUM
	-D TFT_MOSI=13          # ST7796_SPI_BUS_MOSI_IO_NUM
	-D TFT_SCLK=14          # ST7796_SPI_BUS_SCLK_IO_NUM
	-D TFT_CS=15            # ST7796_SPI_CONFIG_CS_GPIO_NUM
	-D TFT_DC=2             # ST7796_SPI_CONFIG_DC_GPIO_NUM
	-D TFT_RST=-1           # ST7796_DEV_CONFIG_RESET_GPIO_NUM
	-D TFT_BL=27            # GPIO_BCKL
	-D TFT_WIDTH=320        # DISPLAY_WIDTH
	-D TFT_HEIGHT=480       # DISPLAY_HEIGHT
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# Touch: XPT2046 (resistive, SPI)
	-D HAS_RESISTIVE_TOUCH=1
	-D TOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-D CYD28_TouchR_IRQ=36  # XPT2046_TOUCH_CONFIG_INT_GPIO_NUM
	-D CYD28_TouchR_MISO=12 # XPT2046_SPI_BUS_MISO_IO_NUM
	-D CYD28_TouchR_MOSI=13 # XPT2046_SPI_BUS_MOSI_IO_NUM
	-D CYD28_TouchR_CLK=14  # XPT2046_SPI_BUS_SCLK_IO_NUM
	-D CYD28_TouchR_CS=33   # XPT2046_SPI_CONFIG_CS_GPIO_NUM

	# SD card
	-D SDCARD_CS=5          # TF_CS
	-D SDCARD_SCK=18        # TF_SPI_SCLK
	-D SDCARD_MISO=19       # TF_SPI_MISO
	-D SDCARD_MOSI=23       # TF_SPI_MOSI

	# Device specific
	-DDEVICE_NAME='"CYD 3248S035R"'
	-DOTA_TAG='"CYD-3248S035R"'

	; 0b0abc, a=invert Y, b=invert X, c=swap XY -> was 7=0b0111
	-D CYD28_TouchR_ROT=5
	-D CYD28_TouchR_CAL_XMIN=280
	-D CYD28_TouchR_CAL_XMAX=3900
	-D CYD28_TouchR_CAL_YMIN=280
	-D CYD28_TouchR_CAL_YMAX=3900
	-D CYD28_DISPLAY_HOR_RES_MAX=480
	-D CYD28_DISPLAY_VER_RES_MAX=320

build_unflags =
	-DDISABLE_OTA
