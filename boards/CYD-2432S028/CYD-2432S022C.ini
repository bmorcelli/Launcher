[env:CYD-2432S022C]
extends = CYD_Base
build_flags =
	${CYD_Base.build_flags}

	# Generated by custom_flags.py from esp32-2432S022C.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32_DEV

	# Panel geometry and backlight
	-D DISPLAY_WIDTH=240
	-D DISPLAY_HEIGHT=320
	-D GPIO_BCKL=0

	# Input
	-D HAS_TOUCH=1

	# Display: ST7789 over an 8-bit i80 bus
	-D TFT_DATABUS_N=5
	-D TFT_DISPLAY_DRIVER_N=1
	-D TFT_INVERSION_OFF
	-D TFT_WIDTH=240  # DISPLAY_WIDTH
	-D TFT_HEIGHT=320 # DISPLAY_HEIGHT
	-D TFT_CS=17      # ST7789_IO_I80_CONFIG_CS_GPIO_NUM
	-D TFT_DC=16      # ST7789_I80_BUS_CONFIG_DC
	-D TFT_RST=-1     # ST7789_DEV_CONFIG_RESET_GPIO_NUM
	-D TFT_WR=4       # ST7789_I80_BUS_CONFIG_WR
	-D TFT_RD=2       # ST7789_RD_GPIO
	-D TFT_D0=15      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D8
	-D TFT_D1=13      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D9
	-D TFT_D2=12      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D10
	-D TFT_D3=14      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D11
	-D TFT_D4=27      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D12
	-D TFT_D5=25      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D13
	-D TFT_D6=33      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D14
	-D TFT_D7=32      # ST7789_I80_BUS_CONFIG_DATA_GPIO_D15
	-D TFT_BCKL=0     # GPIO_BCKL
	-D TFT_BL=0       # GPIO_BCKL
	-D TFT_BUS_SHARED=0
	-D TFT_INVERTED=0
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# Touch: CST820 (capacitive, I2C) -- hal_touch_init/hal_touch_read_raw (src/hal/inputs/touch.cpp)
	-D TOUCH_CTRL_CST8XX=1
	-D CST816S_I2C_CONFIG_SDA_IO_NUM=21
	-D CST816S_I2C_CONFIG_SCL_IO_NUM=22
	-D CST816S_TOUCH_CONFIG_RST_GPIO_NUM=-1
	-D CST816S_TOUCH_CONFIG_INT_GPIO_NUM=-1

	# SD card
	-D SDCARD_CS=5    # TF_CS
	-D SDCARD_SCK=18  # TF_SPI_SCLK
	-D SDCARD_MISO=19 # TF_SPI_MISO
	-D SDCARD_MOSI=23 # TF_SPI_MOSI

	# Device specific
	-DDEVICE_NAME='"CYD 2432S022C"'


; Test env for the LovyanGFX build.
[env:CYD-2432S022C-lovyan]
extends = env:CYD-2432S022C
build_flags =
	${env:CYD-2432S022C.build_flags}

	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_ST7789
	-DLOVYAN_BUS=Bus_Parallel8

lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX @ ^1.2.0
