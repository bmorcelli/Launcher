[env:CYD-2432S032R]
extends = CYD_Base

build_flags =
	${CYD_Base.build_flags}

	# Generated by custom_flags.py from esp32-2432S032R.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32_DEV

	# Panel geometry and backlight
	-D DISPLAY_WIDTH=240
	-D DISPLAY_HEIGHT=320
	-D GPIO_BCKL=27

	# Input
	-D HAS_TOUCH=1

	# Display: ST7789 over SPI
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=1
	-D TFT_MISO=12          # ST7789_SPI_BUS_MISO_IO_NUM
	-D TFT_MOSI=13          # ST7789_SPI_BUS_MOSI_IO_NUM
	-D TFT_SCLK=14          # ST7789_SPI_BUS_SCLK_IO_NUM
	-D TFT_CS=15            # ST7789_SPI_CONFIG_CS_GPIO_NUM
	-D TFT_DC=2             # ST7789_SPI_CONFIG_DC_GPIO_NUM
	-D TFT_RST=-1           # ST7789_DEV_CONFIG_RESET_GPIO_NUM
	-D TFT_BL=27            # GPIO_BCKL
	-D TFT_WIDTH=240        # DISPLAY_WIDTH
	-D TFT_HEIGHT=320       # DISPLAY_HEIGHT
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# Touch: XPT2046 (resistive, SPI)
	-D HAS_RESISTIVE_TOUCH=1
	-D CYD28_TouchR_IRQ=36  # XPT2046_TOUCH_CONFIG_INT_GPIO_NUM
	-D CYD28_TouchR_MISO=12 # XPT2046_SPI_BUS_MISO_IO_NUM
	-D CYD28_TouchR_MOSI=13 # XPT2046_SPI_BUS_MOSI_IO_NUM
	-D CYD28_TouchR_CLK=14  # XPT2046_SPI_BUS_SCLK_IO_NUM
	-D CYD28_TouchR_CS=33   # XPT2046_SPI_CONFIG_CS_GPIO_NUM

	# SD card
	-D SDCARD_CS=5          # TF_CS
	-D SDCARD_SCK=18        # TF_SPI_SCLK
	-D SDCARD_MISO=19       # TF_SPI_MISO
	-D SDCARD_MOSI=23       # TF_SPI_MOSI

	# Device specific
	-DDEVICE_NAME='"CYD 2432S032R"'
	-DOTA_TAG='"CYD-2432S032R"'

	-D CYD28_TouchR_ROT=7
	-D CYD28_TouchR_CAL_XMIN=373
	-D CYD28_TouchR_CAL_XMAX=3344
	-D CYD28_TouchR_CAL_YMIN=302
	-D CYD28_TouchR_CAL_YMAX=3471
	; -D CYD28_DISPLAY_HOR_RES_MAX=240
	; -D CYD28_DISPLAY_VER_RES_MAX=320

	-DTFT_INVERSION_ON
