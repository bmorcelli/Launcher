; Same board manifest as the 2432S028 -- this model only differs in the
; backlight pin, the panel polarity and the touch controller.
[env:CYD-2432W328C]
extends = CYD_Base
board_build.partitions = support_files/custom_4Mb.csv

build_flags =
	${CYD_Base.build_flags}

	# Generated by custom_flags.py from CYD-2432S028.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Chip / board identity
	-D ARDUINO_ESP32_DEV

	# Input
	-D HAS_TOUCH=1

	# Display: ILI9341 over SPI (CYD default wiring)
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=4
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# SD card
	-D SDCARD_CS=5
	-D SDCARD_SCK=18
	-D SDCARD_MISO=19
	-D SDCARD_MOSI=23

	# Touch: CST820 (capacitive, I2C) -- hal_touch_init/hal_touch_read_raw (src/hal/inputs/touch.cpp).
	# Pins match the CYD28_TouchscreenC.h defaults this used to rely on implicitly.
	-D TOUCH_CTRL_CST8XX=1
	-D CST816S_I2C_CONFIG_SDA_IO_NUM=33
	-D CST816S_I2C_CONFIG_SCL_IO_NUM=32
	-D CST816S_TOUCH_CONFIG_RST_GPIO_NUM=25
	-D CST816S_TOUCH_CONFIG_INT_GPIO_NUM=21

	# Device specific
	-DDEVICE_NAME='"CYD 2432W328C"'
	-DOTA_TAG='"CYD-2432W328C"'
	-DTFT_INVERSION_ON
	-DTFT_BL=27 # overrides the 21 above: this model backlights from GPIO27

build_unflags =
	-DDISABLE_OTA

; Inverted colors, and common to the 2.4" capacitive display?
[env:CYD-2432W328C_2]
extends = env:CYD-2432W328C

build_unflags =
	-DTFT_INVERSION_ON # TFT is color inverted
