; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[elecrow]
board = esp32
board_build.f_flash = 80000000L
board_build.partitions = support_files/custom_4Mb_noOta.csv
build_src_filter =${env.build_src_filter} +<../boards/elecrow>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	-DOTA_TAG='"elecrow"'
	-DDISABLE_OTA

	# Configurações de hardware
	-DROTATION=1
	-DHAS_TOUCH=1

	#TFT Configs
	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=4 # Arduino_ILI9341
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=27
	-DTFT_IPS=0
	-DTFT_COL_OFS1=0
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0
	-DTOUCH_CS=33
	-DCYD28_TouchR_IRQ=36
	-DCYD28_TouchR_MISO=12
	-DCYD28_TouchR_MOSI=13
	-DCYD28_TouchR_CLK=14
	-DCYD28_TouchR_CS=33
	-DSDCARD_CS=5
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

lib_ignore =
	SensorLib
	XPowersLib

[elecrowS3]
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/elecrow>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	# Configurações de hardware
	-DROTATION=1
	-DHAS_TOUCH=1

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib

lib_ignore =
	SensorLib
	XPowersLib

[env:elecrow-24B]
extends=elecrow
board=esp32
build_flags =
	${elecrow.build_flags}
	-DDEVICE_NAME='"Elecrow ESP32 24B"'
	-D HAS_RESISTIVE_TOUCH=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D CYD28_TouchR_ROT=6
	-D CYD28_TouchR_CAL_XMIN=557
	-D CYD28_TouchR_CAL_XMAX=3263
	-D CYD28_TouchR_CAL_YMIN=369
	-D CYD28_TouchR_CAL_YMAX=3493


[env:elecrow-28B]
extends=elecrow
board=esp32
build_flags =
	${elecrow.build_flags}
	-DDEVICE_NAME='"Elecrow ESP32 28B"'
 	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D HAS_RESISTIVE_TOUCH=1
	-D CYD28_TouchR_ROT=6
	-D CYD28_TouchR_CAL_XMIN=189
	-D CYD28_TouchR_CAL_XMAX=3416
	-D CYD28_TouchR_CAL_YMIN=359
	-D CYD28_TouchR_CAL_YMAX=3439

[env:elecrow-35B]
extends=elecrow
board=esp32
build_flags =
	${elecrow.build_flags}
	-DDEVICE_NAME='"Elecrow ESP32 35B"'
	-D TFT_DISPLAY_DRIVER_N=28 # Arduino_ILI9488, overrides the 9341 in [elecrow]
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D HAS_RESISTIVE_TOUCH=1
	-D CYD28_TouchR_ROT=6
	-D CYD28_TouchR_CAL_XMIN=353
	-D CYD28_TouchR_CAL_XMAX=3568
	-D CYD28_TouchR_CAL_YMIN=269
	-D CYD28_TouchR_CAL_YMAX=3491
build_unflags =
	-D TFT_DISPLAY_DRIVER_N=4

[env:elecrow-35Bv2_2]
extends=env:elecrow-35B
board=esp32
build_flags =
	${env:elecrow-35B.build_flags}
	-DCYD28_TouchR_CS=12
	-DTFT_MISO=33
