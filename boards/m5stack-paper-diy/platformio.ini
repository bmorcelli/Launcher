; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-paper-diy]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/m5stack-paper-diy>
build_flags =
	${env.build_flags}
	-DM5STACK
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"M5Stack PaperDIY"'
	-DOTA_TAG='"paper"'
	-DOTA_EXTRA='"esp=S3"'

	-DLAUNCHER_GPIO_KEYS='{{"A", 4}, {"B", 3}}' # Hold A or B while booting to start Launcher

	-DUSE_M5GFX=1
	-DE_PAPER_DISPLAY=1

	-DROTATION=0
	-DDIMMER_SETUP=0

	-DFP=2
	-DFM=4
	-DFG=6

	-DHAS_2_BUTTONS=1
	-DBUTTONS_IDF_COMPONENT=1
	-DTFT_WIDTH=540
	-DTFT_HEIGHT=960

	-DSDCARD_CS=47
	-DSDCARD_SCK=39
	-DSDCARD_MISO=40
	-DSDCARD_MOSI=38


lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.28
	m5stack/M5GFX @ ^0.2.35
	https://github.com/bmorcelli/ESP32_Button

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
