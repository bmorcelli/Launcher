[env:waveshare-esp32-c3-lcd-147]
board = esp32c3
board_build.partitions = support_files/custom_4Mb.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-esp32-c3-lcd-147>
extra_scripts =
	${env.extra_scripts}
	pre:boards/waveshare-esp32-c3-lcd-147/patch_sd.py
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DDEVICE_NAME='"Waveshare ESP32-C3 LCD 1.47"'
	-DOTA_TAG='"waveshare-esp32-c3-lcd-147"'
	-DDISABLE_OTA
	-DLAUNCHER_EXPANDER_SD=1
	-DSDCARD_CS=0
	-DSDCARD_SCK=7
	-DSDCARD_MISO=6
	-DSDCARD_MOSI=5
	-DHAS_1_BUTTON=1
	-DROTATION=1
	-DTFT_ROTATION=0
	-DUSE_LOVYANGFX=1
	-include boards/waveshare-esp32-c3-lcd-147/lovyan_compat.h
	-DLOVYAN_PANEL=Panel_ST7789
	-DLOVYAN_BUS=Bus_SPI
	-DTFT_WIDTH=180
	-DTFT_HEIGHT=320
	-DTFT_MEM_WIDTH=240
	-DTFT_MEM_HEIGHT=320
	-DTFT_OFFSET_X=30
	-DTFT_OFFSET_Y=0
	-DTFT_MISO=6
	-DTFT_MOSI=5
	-DTFT_SCLK=7
	-DTFT_CS=-1
	-DTFT_DC=8
	-DTFT_RST=-1
	-DTFT_SPI_HOST=1
	-DTFT_SPI_MODE=0
	-DTFT_INVERTION=1

lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX@^1.3.0
