; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t5-epaper-s3-pro]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t5-epaper-s3-pro>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1

	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_OTA
	-DDEVICE_NAME='"Lilygo T-5 S3 Pro"'

    -DROTATION=0 # 0,2 Portrait, 1,3 to landscape

	-DFP=3
	-DFM=4
	-DFG=5

	-DHAS_TOUCH=1

	-DPMIC_BQ25896=1
	-DGAUGE_BQ27220=1

	-DE_PAPER_DISPLAY
	-DUSE_EPD_PAINTER=1
	-DTFT_WIDTH=540
	-DTFT_HEIGHT=960

	-DSDCARD_CS=16
	-DSDCARD_SCK=18
	-DSDCARD_MISO=8
	-DSDCARD_MOSI=17

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit GFX Library @ ^1.12.1
	https://github.com/tonywestonuk/EPD_Painter#5479e60e21f53efb29a613fb8eee0aad114b152a

lib_ignore =
	GFX Library for Arduino
	lvgl
	GT911 Lite

