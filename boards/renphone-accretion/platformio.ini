; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################### Accretion Phone (DIY, ESP32-S3 + ILI9341 + XPT2046) ##################################
; Home-made phone, ESP32-S3 module with 16MB flash and 8MB OPI PSRAM (N16R8),
; 2.8" ILI9341 240x320 SPI panel and an XPT2046 resistive touch on its own
; (bit-banged) pins. The SD card is wired to the SDIO peripheral in 1-bit mode.
; The generic esp32s3 JSON already matches the module (16MB / qio_opi / 80MHz),
; so no board_* override is needed beyond the partition table.
[env:renphone-accretion]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/renphone-accretion>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DDEVICE_NAME='"Accretion Phone"'
	-DOTA_TAG='"renphone_accretion"'

	; 1 = landscape, the way the phone firmware itself boots. Change it to 0 for
	; portrait -- the touch table in interface.cpp covers all four rotations.
	-DROTATION=1

	; TFT -- ILI9341 240x320 on its own SPI bus (the SD card is SDIO, not shared)
	-D TFT_DATABUS_N=0         # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=4  # Arduino_ILI9341
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=2
	-DTFT_RST=14
	-DTFT_BL=21
	-DTOUCH_CS=-1
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	; Touch -- XPT2046 resistive, bit-banged on its own pins (not the TFT bus)
	-DHAS_TOUCH=1
	-DHAS_RESISTIVE_TOUCH=1     # enables Settings > Calibrate Touch
	-DTOUCH_CTRL_XPT2046=1      # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DCYD28_TouchR_IRQ=-1       # IRQ line not wired, the driver polls
	-DCYD28_TouchR_MISO=4
	-DCYD28_TouchR_MOSI=5
	-DCYD28_TouchR_CLK=6
	-DCYD28_TouchR_CS=9
	; If touch is rotated/mirrored on real hardware, tune this bitmask
	; (bit0 = swap X/Y, bit1 = invert X, bit2 = invert Y) before touching the
	; per-rotation table in interface.cpp. 0 is what the generic 2.8" ILI9341 +
	; XPT2046 module (CYD-2432S028) uses.
	-DCYD28_TouchR_ROT=0

	; SD card -- native SDIO, 1-bit mode. sd_functions.cpp calls SD_MMC.setPins()
	; and mounts it in 1-bit mode from these flags, no board-side code needed.
	-DUSE_SD_MMC=1
	-DSDM=SD_MMC
	-DPIN_SD_CLK=39
	-DPIN_SD_CMD=38
	-DPIN_SD_D0=40

	; Battery sense, 10k+10k voltage divider (read value x2 is the default
	; ANALOG_BAT_MULTIPLIER), ADC1_CH7 so it is safe to read while WiFi is on
	-DANALOG_BAT_PIN=8

	; Keep-off pins, driven in _setup_gpio() (see connections.md)
	-DVIB_PIN=18
	-DRGB_LED_PIN=48

lib_ignore =
	SensorLib
	XPowersLib
