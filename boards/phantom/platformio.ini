; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Rabbit Labs Phantom -- a CYD 2432S024R in a different case.
;
; The panel/touch/SD block below is generated from the CYD board manifest
; boards/CYD-2432S028/source/esp32-2432S024R.json by custom_flags.py; see
; boards/CYD-2432S028/custom_flags.md.

[env:Phantom_S024R]
board = esp32
monitor_speed = 115200
board_build.partitions = support_files/custom_4Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/phantom>
build_flags =
	${env.build_flags}

	# Generated by custom_flags.py from esp32-2432S024R.json
	# Re-run the script after touching the manifest; do not hand-edit.

	# Panel geometry and backlight
	-D DISPLAY_WIDTH=240
	-D DISPLAY_HEIGHT=320
	-D GPIO_BCKL=27

	# Input
	-D HAS_TOUCH=1

	# Display: ILI9341 over SPI
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=4
	-D TFT_MISO=12          # ILI9341_SPI_BUS_MISO_IO_NUM
	-D TFT_MOSI=13          # ILI9341_SPI_BUS_MOSI_IO_NUM
	-D TFT_SCLK=14          # ILI9341_SPI_BUS_SCLK_IO_NUM
	-D TFT_CS=15            # ILI9341_SPI_CONFIG_CS_GPIO_NUM
	-D TFT_DC=2             # ILI9341_SPI_CONFIG_DC_GPIO_NUM
	-D TFT_RST=-1           # ILI9341_DEV_CONFIG_RESET_GPIO_NUM
	-D TFT_BL=27            # GPIO_BCKL
	-D TFT_WIDTH=240        # DISPLAY_WIDTH
	-D TFT_HEIGHT=320       # DISPLAY_HEIGHT
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	-D ROTATION=0

	# Touch: XPT2046 (resistive, SPI)
	-D HAS_RESISTIVE_TOUCH=1
	-D TOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-D CYD28_TouchR_IRQ=36  # XPT2046_TOUCH_CONFIG_INT_GPIO_NUM
	-D CYD28_TouchR_MISO=12 # XPT2046_SPI_BUS_MISO_IO_NUM
	-D CYD28_TouchR_MOSI=13 # XPT2046_SPI_BUS_MOSI_IO_NUM
	-D CYD28_TouchR_CLK=14  # XPT2046_SPI_BUS_SCLK_IO_NUM
	-D CYD28_TouchR_CS=33   # XPT2046_SPI_CONFIG_CS_GPIO_NUM

	# SD card
	-D SDCARD_CS=5          # TF_CS
	-D SDCARD_SCK=18        # TF_SPI_SCLK
	-D SDCARD_MISO=19       # TF_SPI_MISO
	-D SDCARD_MOSI=23       # TF_SPI_MOSI

	# Device specific
	-DDEVICE_NAME='"Rabbit Labs Phantom"'
	-DOTA_TAG='"phantom"'

	-D CYD28_DISPLAY_HOR_RES_MAX=320
	-D CYD28_DISPLAY_VER_RES_MAX=240

	-D CYD28_TouchR_ROT=3
	-D CYD28_TouchR_CAL_XMIN=398
	-D CYD28_TouchR_CAL_XMAX=3760
	-D CYD28_TouchR_CAL_YMIN=235
	-D CYD28_TouchR_CAL_YMAX=3650

lib_ignore =
	SensorLib
	XPowersLib
