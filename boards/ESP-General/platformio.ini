; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:headless-esp32-4mb]
board = esp32
board_build.partitions = support_files/custom_4Mb_noOta.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"ESP32 Devkit"'

	-DHEADLESS=1
	# No panel: DisplayDrivers' no-op backend, so the display code still
	# compiles and every draw call costs nothing.
	-DUSE_DUMMY_TFT=1

	# ESP32 devKit onboard led
	-DLED=2
	-DLED_ON=HIGH

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

[env:headless-esp32-8mb]
extends=env:headless-esp32-4mb
board_build.partitions = support_files/custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608


; Everything the two S3 devkit flavours share. What differs between them is the
; flash size and which devkit the board identity macros name -- and, on the 4 MB
; Feather profile, PSRAM and the 1200 bps upload touch.
[headless_s3]
board = esp32s3
# The generic esp32s3 board carries octal PSRAM (qio_opi); a plain devkit is QSPI.
board_build.arduino.memory_type = qio_qspi
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"ESP32-S3 Devkit"'

	-DHEADLESS=1
	# No panel: DisplayDrivers' no-op backend, so the display code still
	# compiles and every draw call costs nothing.
	-DUSE_DUMMY_TFT=1

	-DLED=38
	-DLED_ON=HIGH

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

[env:headless-esp32s3-4mb]
extends=headless_s3
board_build.partitions = support_files/custom_4Mb_noOta.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_flags =
	${headless_s3.build_flags}
	-DBOARD_HAS_PSRAM

[env:headless-esp32s3-8mb]
extends=headless_s3
board_build.partitions = support_files/custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

[env:headless-esp32s3-16mb]
extends=env:headless-esp32s3-8mb
board_build.partitions = support_files/custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
