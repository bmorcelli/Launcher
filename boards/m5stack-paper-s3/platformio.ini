; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-paper-s3]
board = m5stack-paper-s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
build_src_filter =${env.build_src_filter} +<../boards/m5stack-paper-s3>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"M5Stack Paper S3"'
	-DOTA_TAG='"paper"'
	-DOTA_EXTRA='"esp=S3"'

	-DUSE_M5GFX=1
	-DE_PAPER_DISPLAY=1
	-DUSE_CANVAS=1

	-DROTATION=0

	-DFP=2
	-DFM=4
	-DFG=6

	-DHAS_TOUCH=1
	-DTFT_WIDTH=540
	-DTFT_HEIGHT=960

	-DSDCARD_CS=47
	-DSDCARD_SCK=39
	-DSDCARD_MISO=40
	-DSDCARD_MOSI=38


lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino


[env:m5stack-paper]
board = m5stack-paper
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/m5stack-paper-s3>
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"M5Stack Paper"'
	-DOTA_TAG='"paper"'
	-DOTA_EXTRA='"esp=32"'

	-DUSE_M5GFX=1
	-DE_PAPER_DISPLAY=1

	-DROTATION=0

	-DFP=2
	-DFM=4
	-DFG=6

	-DHAS_TOUCH=1
	-DTFT_WIDTH=540
	-DTFT_HEIGHT=960

	-DTFT_MOSI=12 # uses same SDBus, need it to make it work
	-DSDCARD_CS=4
	-DSDCARD_SCK=14
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=12


lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17

lib_ignore =
	GFX Library for Arduino

