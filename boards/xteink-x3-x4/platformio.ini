; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Xteink X3 and X4 in one binary.
;
; The two are the same board with two different panels bolted on: same ESP32-C3,
; same buttons, same SD card, same display pins. They differ in the glass and in
; how the battery is read, and each of them shipped with more than one panel
; controller behind that glass, so this env carries all five and picks at boot.
;
; The X4 *Pro* is not related — it is an ESP32-S3 with a different pinout for
; every subsystem. It lives in boards/xteink-x4pro, and shares only this file's
; two UltraChip X4 panel classes.
;
; ---------------------------------------------------------------------------
; WHAT IS ON THE BOARD, AND HOW IT IS FOUND
; ---------------------------------------------------------------------------
; Model, first: the X3 carries a TI BQ27220 fuel gauge at 0x55 on its own I2C
; bus and the X4 does not — the X4 reads an ADC on GPIO0 instead, which is where
; the X3 puts I2C SCL. One I2C probe separates them, and with them the geometry
; (792x528 vs 800x480) and the battery path.
;
; Controller, second. Xteink changed it mid-production on both models; the
; glass, the resolution and the pinout are unchanged. interface.cpp resolves it
; from the panel itself:
;
;   X4:  SSD1677  original  -> index 0, the seeded default
;        UC8179   newer batches (UltraChip). Same KW command family as the X3's
;                 UC8253, but needs an explicit PLL/booster/VCOM bring-up
;                 instead of the SSD1677's OTP waveform.        -> index 1
;        UC8279   a second UltraChip variant (LUT_VER 0x02/0x68): its own
;                 PSR/PLL init, no CDI, a 120-gate offset.      -> index 2
;
;   X3:  UC8253   original                                      -> index 3
;        UC8279d  newer batches, announced by Xteink in July 2026. Ships a blank
;                 MTP, so the host supplies the drive rails and uploads the
;                 waveform banks itself.                        -> index 4
;
; The SSD1677 is told apart from every UltraChip part by BUSY polarity alone —
; it flags busy HIGH and so idles LOW, they idle HIGH. The UltraChip parts are
; then told apart by the VER register (0x70). See lib/xteink_panel/xteink_panel_probe.
;
; An unrecognised answer falls back to the model's original controller, which is
; what these builds did before runtime selection existed. The probe prints what
; it read; if a unit comes up dark, that line is the bug report.
;
; Reference (each driver documented and, for the UC8179, bench-confirmed):
;   https://github.com/Free-Ink/freeink-sdk
; ---------------------------------------------------------------------------
[env:xteink-x3-x4]
board = esp32c3
board_build.partitions = support_files/custom_16Mb.csv
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 1572864
build_src_filter = ${env.build_src_filter} +<../boards/xteink-x3-x4>

build_flags =
	${env.build_flags}
	-D DEVICE_NAME='"xteink x4"'     # rewritten at boot when the probe finds an X3
	-D OTA_TAG='"xteink-x4"'         # likewise; both tags must serve this binary
	;-D DISABLE_OTA=1                 # Disable OTA Functionality

	# Flags to increase the font sizes, increasing UI icons and texts
	-D FP=3
	-D FM=5
	-D FG=7

	# Screen default rotation
	-D ROTATION=3
	-D DIMMER_SETUP=0

	# Navigation layout
	# Seven buttons: Back, Confirm, Left, Right, Up, Down and Power. The first
	# six sit on two ADC resistor ladders, decoded in interface.cpp.
	-D HAS_5_BUTTONS=1  # 5 buttons (Up, Down, Left, Right, Sel)

	-D USE_GXEPD2=1      # to use GxEPD2 display library
	-D GXEPD2_FULL_REFRESH_INTERVAL=0 ; Disable full refresh interval
	-D E_PAPER_DISPLAY=1

	# Panel geometry seeds the X4; interface.cpp rewrites it for an X3 before
	# tft->begin() builds anything from it.
	-D TFT_WIDTH=800
	-D TFT_HEIGHT=480

	# The five panels, in the index order documented at the top of this file.
	# About 3.8 kB each for the four alternates; the partition has the room.
	-D GXEPD2_PANEL=GxEPD2_426_GDEQ0426T82
	-D GXEPD2_PANEL_ALT1=GxEPD2_X4_800x480_UC8179
	-D GXEPD2_PANEL_ALT2=GxEPD2_X4_800x480_UC8279
	-D GXEPD2_PANEL_ALT3=GxEPD2_X3_792x528
	-D GXEPD2_PANEL_ALT4=GxEPD2_X3_792x528_UC8279

	# Display pins. Identical on both models — only the panel differs.
	-D TFT_CS=21
	-D TFT_DC=4
	-D TFT_RST=5
	-D TFT_BUSY=6
	-D TFT_SCLK=8
	-D TFT_MOSI=10

	# SDCard macros needed to use SPI setup
	# The card hangs off the same bus as the panel — only CS differs, and the
	# MISO the panel never uses is the card's. Because TFT_MOSI == SDCARD_MOSI,
	# setupSdCard() reuses the bus interface.cpp already brought up rather than
	# starting a second SPIClass on the same pins.
	-D SDCARD_CS=12
	-D SDCARD_SCK=8     # shared with TFT_SCLK
	-D SDCARD_MISO=7    # bus MISO; the panel is write-only
	-D SDCARD_MOSI=10   # shared with TFT_MOSI

lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
