; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The X3 and the X4 are the same board with two different panels bolted on:
; same ESP32-C3, same buttons, same SD card, same display pins. Everything they
; share lives here; each env below adds only its panel and its battery.
;
; The X4 *Pro* is not related — it is an ESP32-S3 with a different pinout for
; every subsystem. It lives in boards/xteink-x4pro.
;
; ---------------------------------------------------------------------------
; PANEL BATCH VARIANTS — both envs here target the ORIGINAL batch only
; ---------------------------------------------------------------------------
; Xteink changed panel controller mid-production on both models. The glass, the
; resolution and the pinout are unchanged; only the controller behind them
; differs, and nothing at build time can tell you which one a unit has. The
; FreeInk SDK resolves it at boot by bit-banging a half-duplex read of the
; controller's VER register (0x70) on the display pins after a reset pulse, and
; picks the driver before starting the display.
;
;   X4:  SSD1677  original  <- what env:xteink-x4 builds for
;        UC8179   newer batches (UltraChip). Same KW command family as the X3's
;                 UC8253, but needs an explicit PLL/booster/VCOM bring-up
;                 instead of the SSD1677's OTP waveform.
;        UC8279   a second UltraChip variant (LUT_VER 0x02/0x68): its own
;                 PSR/PLL init, 1-byte CDI, gate offset, inverted AA planes.
;
;   X3:  UC8253   original  <- what env:xteink-x3 builds for
;        UC8279d  newer batches, announced by Xteink in July 2026. Runs pure
;                 factory OTP waveforms (PSR REG=0), so it needs no LUT upload
;                 at all — the opposite of the UC8253 driver in this folder,
;                 which loads a LUT set on every refresh. Its LUT format is
;                 group-based (7-byte groups, 7 per LUT in KW mode) rather than
;                 the UC8253's 42-byte banks, so the tuned waveforms here
;                 cannot be carried over.
;
; A unit from a newer batch resets and runs waveforms but never develops an
; image — that is the failure mode to expect until runtime detection lands.
;
; Reference (each driver documented and, for the UC8179, bench-confirmed):
;   https://github.com/Free-Ink/freeink-sdk/blob/main/docs/xteink-x3-uc8279-support.md
; ---------------------------------------------------------------------------
[xteink_base]
board = esp32-c3-devkitm-1
board_build.partitions = support_files/custom_16Mb.csv
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 1572864
build_src_filter = ${env.build_src_filter} +<../boards/xteink-x3-x4>

build_flags =
	${env.build_flags}
	-D DISABLE_OTA=1                 # Disable OTA Functionality

	# Flags to increase the font sizes, increasing UI icons and texts
	-D FP=3
	-D FM=5
	-D FG=7

	# Screen default rotation
	-D ROTATION=0

	# Navigation layout
	# Seven buttons: Back, Confirm, Left, Right, Up, Down and Power. The first
	# six sit on two ADC resistor ladders, decoded in interface.cpp.
	;-D HAS_1_BUTTON=1  # 1 or 2 buttons
	;-D HAS_3_BUTTONS=1 # 3 buttons (Next, Prev, Sel)
	-D HAS_5_BUTTONS=1  # 5 buttons (Up, Down, Left, Right, Sel)
	;-D HAS_ENCODER=1   # Encoder
	;-D HAS_KEYBOARD=1  # Has a keyboard
	;-D HAS_TOUCH=1     # Touchscreen, display the footer bar with btns description

	-D USE_GXEPD2=1      # to use GxEPD2 display library
	-D E_PAPER_DISPLAY=1

	# Display pins. Identical on both models — only the panel differs.
	-D TFT_CS=21
	-D TFT_DC=4
	-D TFT_RST=5
	-D TFT_BUSY=6
	-D TFT_SCLK=8
	-D TFT_MOSI=10

	# SDCard macros needed to use SPI setup
	# The card hangs off the same bus as the panel — only CS differs, and the
	# MISO the panel never uses is the card's. Because TFT_MOSI == SDCARD_MOSI,
	# setupSdCard() reuses the bus interface.cpp already brought up rather than
	# starting a second SPIClass on the same pins.
	-D SDCARD_CS=12
	-D SDCARD_SCK=8     # shared with TFT_SCLK
	-D SDCARD_MISO=7    # bus MISO; the panel is write-only
	-D SDCARD_MOSI=10   # shared with TFT_MOSI

lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino

; ---------------------------------------------------------------------------
; X4 — GDEQ0426T82, 800x480, SSD1677. Stock GxEPD2 class, no patching.
; Battery read from an ADC on GPIO0 behind a 1:2 divider.
; Original batch only — see the panel variants note at the top of this file.
; ---------------------------------------------------------------------------
[env:xteink-x4]
extends = xteink_base
build_flags =
	${xteink_base.build_flags}
	-D DEVICE_NAME='"xteink x4"'
	-D OTA_TAG='"xteink-x4"' # This tag must be added into the OTA Backend

	-D TFT_WIDTH=800
	-D TFT_HEIGHT=480
	-D GXEPD2_PANEL=GxEPD2_426_GDEQ0426T82

	# Battery pin, if using voltage divider
	# Left commented on purpose: the ADC is there, but interface.cpp implements
	# getBattery() with the device's own discharge curve instead of the generic
	# linear one.
	;-D ANALOG_BAT_PIN=0

; ---------------------------------------------------------------------------
; X3 — 792x528 on a UC8253, which GxEPD2 has no class for. The one in this
; folder is a transcription of the community SDK's X3 paths, and needs -I so
; the library's own translation units can see it (the header is pulled in by
; include/DisplayDrivers_User_Setup.h behind DISPLAY_XTEINK_X3).
; Battery comes from a BQ27220 fuel gauge on I2C, not from an ADC.
; Original batch only — see the panel variants note at the top of this file.
;
; Untested on hardware.
; ---------------------------------------------------------------------------
[env:xteink-x3]
extends = xteink_base
build_flags =
	${xteink_base.build_flags}
	-D DEVICE_NAME='"xteink x3"'
	-D OTA_TAG='"xteink-x3"' # This tag must be added into the OTA Backend

	-D TFT_WIDTH=792
	-D TFT_HEIGHT=528
	-D DISPLAY_XTEINK_X3=1
	-D GXEPD2_PANEL=GxEPD2_X3_792x528
	-I boards/xteink-x3-x4
