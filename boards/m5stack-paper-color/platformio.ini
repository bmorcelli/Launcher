; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-paper-color]
board = m5stack-paper-s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
build_src_filter =${env.build_src_filter} +<../boards/m5stack-paper-color>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-paper-color
	-DOTA_TAG='"paper"'
	-DOTA_EXTRA='"esp=S3"'

	-DUSE_M5GFX=1
	-DE_PAPER_DISPLAY=1
	; Panel_ED2208 (E Ink Spectra 6): color e-paper with NO partial refresh —
	; every update is a full ~10s color refresh. Coalesce navigation so rapid
	; key presses trigger a single refresh instead of one per press.
	-DM5_PAPER_COLOR=1

	-DROTATION=0
	-DBTN_ALIAS='"M5"'
	-DHAS_BTN=1
	-DSEL_BTN=1
	-DUP_BTN=9
	-DDW_BTN=10

	-DFP=1
	-DFM=3
	-DFG=5

	-DTFT_WIDTH=400
	-DTFT_HEIGHT=600

	-DSDCARD_CS=47
	-DSDCARD_SCK=15
	-DSDCARD_MISO=14
	-DSDCARD_MOSI=13


lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17
	m5stack/M5GFX @ ^0.2.21

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
