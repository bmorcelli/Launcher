######################## Seeed Studio Wio Tracker L2 (ESP32-S3) ##############################
; Wio-S3 module (ESP32-S3 + SX1262): 16MB flash, 8MB octal PSRAM -- the generic
; esp32s3 JSON already matches it (16MB / qio_opi / 80MHz).
;
; 3.2" NV3031B 240x320 IPS on QSPI (driver 51, lives in DisplayDrivers' own
; src/panels/), GT911 touch and an LP5814 backlight on I2C, and most power/reset
; lines behind a PCA9555 IO expander. Pinout from Meshtastic's
; variants/esp32s3/seeed_wio_tracker_L2 -- see connections.md.
;
; https://wiki.seeedstudio.com/meshtastic_wio_tracker_l2_intro/
[env:seeedstudio-wio-tracker-l2]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.speed = 921600

build_src_filter = ${env.build_src_filter} +<../boards/seeedstudio-wio-tracker-l2>
build_flags =
	${env.build_flags}
	-I lib/SensorLib/src/
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-D DEVICE_NAME='"Seeed Wio Tracker L2"'
	-D OTA_TAG='"seeedstudio_wio_tracker_l2"'
	-D OTA_EXTRA='"esp=S3"'
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000

	# Panel is native portrait; rotation 1 is the landscape the case is built
	# for (MADCTL = MY|MV, same as Meshtastic's offset_rotation=1).
	-D ROTATION=1
	-D DIMMER_SETUP=20

	# BOOT (GPIO0) on the HAL's 1-button layout; the side WAKE button sits on
	# the IO expander and is read in interface.cpp as Esc.
	-D HAS_1_BUTTON=1
	-D HAS_TOUCH=1
	-D TOUCH_CTRL_GT911=1

	-D USE_ARDUINO_GFX=1
	-D TFT_DATABUS_N=1        # Arduino_ESP32QSPI
	-D TFT_DISPLAY_DRIVER_N=51 # Arduino_NV3031B (DisplayDrivers src/panels/)
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_CS=46
	-D TFT_SCLK=42
	-D TFT_D0=41
	-D TFT_D1=40
	-D TFT_D2=39
	-D TFT_D3=38
	# RST is on the IO expander (pulsed in _setup_gpio()); the driver falls
	# back to a software reset. Backlight is the LP5814 on I2C, no TFT_BL.
	-D TFT_RST=-1
	-D TFT_IPS=1              # needs INVON, otherwise a green grid
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0
	# The panel's QSPI bus gets its own host; SPI2 (FSPI) is the SX1262's.
	-D ESP32QSPI_SPI_HOST=SPI3_HOST

	# microSD on SDMMC 1-bit, powered through the IO expander (P14).
	-D USE_SD_MMC=1
	-D SDM=SD_MMC
	-D PIN_SD_CLK=2
	-D PIN_SD_CMD=3
	-D PIN_SD_D0=1

lib_deps =
	${env.lib_deps}
