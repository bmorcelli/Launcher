; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeedstudio-sensecap]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = support_files/custom_8Mb2.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/seeedstudio-sensecap>
build_unflags =
	${env.build_unflags}
	-flto
	-flto=auto

custom_sdkconfig =
	CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
	CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
	CONFIG_GDMA_ISR_IRAM_SAFE=y
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
	CONFIG_SPIRAM_RODATA=y

build_flags =
	${env.build_flags}
	-include boards/seeedstudio-sensecap/sensecap_display_bus.h
	-idirafter src/
	-I lib/DisplayDrivers/src/
	-I lib/Arduino_GFX/src/
	-I lib/ArduinoJson/src/
	-I lib/SensorLib/src/
	-DCONFIG_MBEDTLS_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DDISABLE_MASS_STORAGE=1

	-DDEVICE_NAME='"Seeed SenseCAP Indicator"'
	-DOTA_TAG='"seeedstudio-sensecap"'

	-DUSE_ARDUINO_GFX=1
	-DROTATION=2
	-DHAS_1_BUTTON=1
	-DHAS_TOUCH=1

	# Flags to increase the font sizes, increasing UI icons and texts
	-D FP=2
	-D FM=3
	-D FG=4

	; This board has no SD card wired to the ESP32-S3.

	-D TFT_DATABUS_N=3   # Arduino_ESP32RGBPanel
	-D TFT_DISPLAY_DRIVER_N=49 # Arduino_RGB_Display
	-D TFT_WIDTH=480
	-D TFT_HEIGHT=480
	-D TFT_DE=18
	-D TFT_VSYNC=17
	-D TFT_HSYNC=16
	-D TFT_PCLK=21
	-D TFT_R0=4
	-D TFT_R1=3
	-D TFT_R2=2
	-D TFT_R3=1
	-D TFT_R4=0
	-D TFT_G0=10
	-D TFT_G1=9
	-D TFT_G2=8
	-D TFT_G3=7
	-D TFT_G4=6
	-D TFT_G5=5
	-D TFT_B0=15
	-D TFT_B1=14
	-D TFT_B2=13
	-D TFT_B3=12
	-D TFT_B4=11
	-D TFT_HSYNC_POL=1
	-D TFT_HSYNC_FRONT_PORCH=10
	-D TFT_HSYNC_PULSE_WIDTH=8
	-D TFT_HSYNC_BACK_PORCH=50
	-D TFT_VSYNC_POL=1
	-D TFT_VSYNC_FRONT_PORCH=10
	-D TFT_VSYNC_PULSE_WIDTH=8
	-D TFT_VSYNC_BACK_PORCH=20
	-D TFT_PCLK_ACTIVE_NEG=0
	-D TFT_PREF_SPEED=18000000
	-D TFT_RGB_BOUNCE_BUF_PX=9600 # width * ~20 lines, ESP32-S3 RGB/PSRAM drift errata
	-D TFT_RGB_INIT=st7701_type1_init_operations
	# CS is on the IO expander; sensecapInitBus() toggles it there while
	# driving native GPIO41/GPIO48 for the ST7701S 9-bit SPI init bus.
	-D TFT_RGB_INIT_BUS=SENSECAP_RGB_INIT_BUS
	-D TFT_BL=45

	; FT6336-family touch controller (I2C), reset wired through the IO
	; expander -- see interface.cpp, hal_touch_init() is called with its
	; address explicitly since it differs from the HAL's default.
	-D TOUCH_CTRL_FT6X36=1

lib_deps =
	${env.lib_deps}
