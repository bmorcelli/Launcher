; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:elecrow-esp32s3-5in]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/elecrow-esp32s3-5in>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DDISABLE_MASS_STORAGE=1

	-DDEVICE_NAME='"Elecrow CrowPanel Advance 5.0"'
	-DOTA_TAG='"elecrow-esp32s3-5in"'

	-DROTATION=1
	-DHAS_TOUCH=1

	# The actual fix: ESP32-S3 RGB-panel-over-PSRAM has a well-known "screen
	# drift" errata when the DMA fetch falls behind PSRAM traffic (this board
	# has zero bounce buffer by default, since Arduino_ESP32RGBPanel's own
	# default is 0/off). Espressif's documented workaround is a bounce buffer
	# sized width * ~10 lines; Elecrow's own reference config for the same
	# panel class uses exactly that.
	-DTFT_RGB_BOUNCE_BUF_PX=8000

	-DFP=2
	-DFM=4
	-DFG=6

	# Display: ST7262-class RGB panel, 800x480, driven over Arduino_ESP32RGBPanel.
	# Pins per Elecrow's own LovyanGFX_Driver.h example for this model.
	-DTFT_DATABUS_N=3   # Arduino_ESP32RGBPanel
	-DTFT_DISPLAY_DRIVER_N=49 # Arduino_RGB_Display
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=480
	-DTFT_DE=42
	-DTFT_VSYNC=41
	-DTFT_HSYNC=40
	-DTFT_PCLK=39
	-DTFT_R0=7
	-DTFT_R1=17
	-DTFT_R2=18
	-DTFT_R3=3
	-DTFT_R4=46
	-DTFT_G0=9
	-DTFT_G1=10
	-DTFT_G2=11
	-DTFT_G3=12
	-DTFT_G4=13
	-DTFT_G5=14
	-DTFT_B0=21
	-DTFT_B1=47
	-DTFT_B2=48
	-DTFT_B3=45
	-DTFT_B4=38

	-DTFT_BL=-1
	-DTFT_HSYNC_POL=0
	-DTFT_HSYNC_FRONT_PORCH=8
	-DTFT_HSYNC_PULSE_WIDTH=4
	-DTFT_HSYNC_BACK_PORCH=8
	-DTFT_VSYNC_POL=0
	-DTFT_VSYNC_FRONT_PORCH=8
	-DTFT_VSYNC_PULSE_WIDTH=4
	-DTFT_VSYNC_BACK_PORCH=8
	-DTFT_PCLK_ACTIVE_NEG=true
	-DTFT_PREF_SPEED=16000000

	-DTOUCH_GT911_I2C=1
	-DGT911_I2C_CONFIG_SDA_IO_NUM=15
	-DGT911_I2C_CONFIG_SCL_IO_NUM=16
	-DGT911_TOUCH_CONFIG_RST_GPIO_NUM=-1
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=-1

	-DSDCARD_MISO=4
	-DSDCARD_SCK=5
	-DSDCARD_MOSI=6
	-DSDCARD_CS=2

lib_deps =
	${env.lib_deps}

lib_ignore =
	XPowersLib
