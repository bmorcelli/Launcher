; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Seeed Studio reTerminal D1001.
;
; ESP32-P4 main SoC + ESP32-C6 co-processor bridged over SDIO (WiFi/BT, same
; scheme as lilygo-t-display-p4/elecrow-esp32p4-7in), 800x1280 portrait
; MIPI-DSI JD9365-family panel (2 lanes), GSL3670 I2C capacitive touch
; (board-local driver, not the shared touch HAL -- see gsl3670_touch.*),
; PCA9535 IO expander for power sequencing/backlight/battery gating, 3.7V
; battery via ADC, one physical button, microSD (SDMMC 4-bit, slot 0).
;
; Pins, timings and the IO expander bit map come from Seeed's own ESP-IDF BSP
; (esp32_p4_re_terminal_d1001.h/.c) -- see connections.md for the full table
; and everything still unconfirmed on real hardware. NOT bench-tested.

[env:seeedstudio-reterminal-d1001]
board = esp32p4_es
board_build.partitions = support_files/custom_16Mb_p4.csv
build_src_filter = ${env.build_src_filter} +<../boards/seeedstudio-reterminal-d1001>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	-DDEVICE_NAME='"Seeed reTerminal D1001"'
	-DOTA_TAG='"seeedstudio-reterminal-d1001"'

	# ESP32-C6 co-processor over SDIO for WiFi/BT. This board is wired for
	# BOTH ESP-Hosted and ESP-AT firmware on the C6 -- launcherWifiInitSdioAuto()
	# (src/idf/idf_wifi.cpp) tries ESP-AT first when this flag is set and falls
	# back to ESP-Hosted automatically, same as lilygo-t-display-p4.
	;-D ENABLE_ESP_AT_INTERFACE=1

	-DFP=3
	-DFM=5
	-DFG=7

	# Native panel is 800(w)x1280(h) portrait; the UI is driven in landscape,
	# same convention as the other P4/DSI boards in this repo. UNCONFIRMED on
	# real hardware -- may need flipping to rotation 3 depending on how the
	# glass sits in the enclosure.
	-D ROTATION=3
	-D DIMMER_SETUP=60
	-D HAS_TOUCH=1

	# Single physical button (BSP_BUTTON_IN).
	-D HAS_1_BUTTON=1
	-DLAUNCHER_GPIO_KEYS='{{"Sel", 3}}'

	# --- Display: JD9365-family 8" DSI panel, 800x1280, 2 lanes ---------------
	# Timings from Espressif's JD9365_8_800_1280_PANEL_60HZ_DPI_CONFIG macro
	# (esp_lcd_jd9365_8 component in the reference BSP). Init table is the new
	# jd9365_8_800_1280_init_operations array added to
	# lib/Arduino_GFX/src/display/Arduino_DSI_Display.h (kept separate from the
	# pre-existing, unrelated jd9365_init_operations array in that file).
	-DTFT_DATABUS_N=4    # Arduino_ESP32DSIPanel
	-DTFT_DISPLAY_DRIVER_N=50 # Arduino_DSI_Display
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=1280
	# No display reset GPIO wired directly to the P4 -- the BSP toggles reset
	# through the PCA9535 IO expander, but -1 (software SWRESET via the panel's
	# own 0x11/init sequence) is what lilygo-t-display-p4 already uses on this
	# same Arduino_ESP32DSIPanel/Arduino_DSI_Display path, so it's used here too
	# rather than adding an IO-expander dependency just for display bring-up.
	-DTFT_RST=-1
	-DTFT_HSYNC_PULSE_WIDTH=20
	-DTFT_HSYNC_BACK_PORCH=20
	-DTFT_HSYNC_FRONT_PORCH=40
	-DTFT_VSYNC_PULSE_WIDTH=4
	-DTFT_VSYNC_BACK_PORCH=30
	-DTFT_VSYNC_FRONT_PORCH=30
	-DTFT_PREF_SPEED=60000000
	-DTFT_DSI_LANE_BIT_RATE=1000
	-DTFT_DSI_INIT=jd9365_8_800_1280_init_operations
	# Backlight PWM pin (BSP_LCD_BACKLIGHT). The boost converter feeding it and
	# the panel's own power rail are gated by the PCA9535 (BSP_LCD_BACKLIGHT_EN/
	# BPS_LCD_PWR_EN bits) -- interface.cpp drives those once at boot before
	# attaching PWM here.
	-DTFT_BL=14

	# --- Touch: GSL3670, I2C, board-local driver (gsl3670_touch.cpp) ----------
	# Not TOUCH_CTRL_* / hal_touch_* on purpose -- this repo's touch HAL has no
	# GSL3670 case and none is being added there. Bus 0 (BSP_I2C_0): touch only.
	# Reset is PCA9535 expander bit 12, driven from interface.cpp
	# (d1001TouchResetSet()) -- NOT a GPIO flag here. GPIO12 on the bare P4 is
	# BSP_WIFI_BOOT (the C6 co-processor's boot strap), a different signal;
	# driving it as touch reset never actually reset the touch chip.
	-D GSL3670_SDA=37
	-D GSL3670_SCL=38

	# --- WiFi/BT: onboard ESP32-C6 over SDIO -----------------------------------
	-D SDIO2_CLK=GPIO_NUM_11
	-D SDIO2_CMD=GPIO_NUM_6
	-D SDIO2_D0=GPIO_NUM_7
	-D SDIO2_D1=GPIO_NUM_8
	-D SDIO2_D2=GPIO_NUM_9
	-D SDIO2_D3=GPIO_NUM_10
	-D SDIO2_RST=GPIO_NUM_13

	# --- microSD: plain SPI (SD/SPIClass), NOT SD_MMC --------------------------
	# ESP-Hosted has a known bug where SDIO1 (this SD card) and SDIO2 (WiFi/C6,
	# above) cannot run concurrently on the P4 -- same conflict
	# lilygo-t-display-p4 hits on this same chip, and the same fix: the SD card
	# stays on plain SPI, reusing the SDMMC-slot-0 IOMUX pins as SPI signals,
	# instead of 4-bit SD_MMC (USE_SD_MMC is deliberately NOT set here).
	-D PIN_SD_CLK=43
	-D PIN_SD_CMD=44
	-D PIN_SD_D0=39
	-D PIN_SD_D1=40
	-D PIN_SD_D2=41
	-D PIN_SD_D3=42
	-D SD_SCLK=PIN_SD_CLK
	-D SD_MOSI=PIN_SD_CMD
	-D SD_MISO=PIN_SD_D0
	-D SD_CS=PIN_SD_D3
	-D SDCARD_CS=PIN_SD_D3
	-D SDCARD_SCK=PIN_SD_CLK
	-D SDCARD_MISO=PIN_SD_D0
	-D SDCARD_MOSI=PIN_SD_CMD
	# Same on-chip LDO power requirement as SD_MMC's BOARD_SDMMC_POWER_CHANNEL
	# applies here too -- SD_MMC.begin() would power it automatically, but the
	# plain SD/SPIClass path doesn't, so interface.cpp powers it by hand
	# (_powerSdCardIoLdo(), same pattern lilygo-t-display-p4 uses).
	-D BOARD_SDMMC_SLOT=0
	-D BOARD_HAS_SDMMC=1
	-D BOARD_SDMMC_POWER_CHANNEL=4

	# --- Battery: divider on GPIO18 (ADC1_CH2), gated by the PCA9535's
	# BSP_BAT_READ_EN bit (driven once at boot in interface.cpp). Multiplier is
	# unconfirmed -- see connections.md.
	-D ANALOG_BAT_PIN=18

lib_deps =
	${env.lib_deps}

lib_ignore =
	SensorLib
	XPowersLib
