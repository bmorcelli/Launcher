; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:_New-Device-Model]
# One generic board JSON per MCU lives in boards/_jsonfiles: esp32, esp32s2,
# esp32s3, esp32c3, esp32c5, esp32c6, esp32p4 and esp32p4_es (pre rev.300).
# Pick the one that matches the chip and describe the rest of the board here.
board = esp32s3
board_build.partitions = support_files/custom_4Mb.csv

# Anything in which this board differs from the generic JSON goes here, e.g.:
# board_build.arduino.memory_type = qio_qspi # qio_opi when PSRAM is octal
# board_build.flash_mode = qio
# board_build.f_flash = 80000000L
# board_upload.flash_size = 8MB
# board_upload.maximum_size = 8388608
# board_upload.maximum_ram_size = 327680
# board_upload.speed = 921600
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
	${env.build_flags}
	# Device Specific build flags
	;-DBOARD_HAS_PSRAM			# Set it if board has PSRAM
	;-DARDUINO_USB_MODE=1		# ESP32S3 usually use it
	;-DARDUINO_USB_CDC_ON_BOOT=1 # ESP32S3 usually use it
	;-DDISABLE_MASS_STORAGE=1   # if your ESP32-S3 uses a CH340 to UART-SERIAL convert, USB massStorage will not work,
								# So disabling it is the way to go.

	# standard ESP32 only if hs PSRAM
	;-mfix-esp32-psram-cache-issue
	;-mfix-esp32-psram-cache-strategy=memw

	# Device information
	-D DEVICE_NAME='"My Device Name"'
	-D OTA_TAG='"my_device_ota_tag"' # This tag must be added into the OTA Backend
	-D OTA_EXTRA='"esp=S3"'          # OPTIONAL > to specify an extra query to the search API search
	-D DISABLE_OTA=1                 # Disable OTA Functionality
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000 # data partition above this size on manifest will be maximized
	;-D BOOT_LOGIC_ON_NVS=1			 # NVS is used to control the boot process when bootloader logic is not enough

	# Headless environment
	;-D HEADLESS=1      # Don't compile display. Serial or WebUI mode only
	;-D USE_DUMMY_TFT=1 # No panel: every DisplayDrivers call becomes a no-op
	;-D LED=38      # Sets the LED pin to blink during start up
	;-D LED_ON=HIGH # LED on state

	# ESP32-P4 config when the slave MCU uses ESP_AT setup instead of esp_hosted
	;-D ENABLE_ESP_AT_INTERFACE=1

	# Flags to increase the font sizes, increasing UI icons and texts
	;-D FP=3
	;-D FM=5
	;-D FG=7

	# Screen default rotation
	-D ROTATION=3
	-D DIMMER_SETUP=20 # Set Default dimmer dim time

	# Battery pin, if using voltage divider
	-D ANALOG_BAT_PIN=38

	# Power HAL (src/hal/power) -- charger IC and fuel gauge, selected by
	# chip. Board fills a DevicePmic/DeviceGauge (pins + I2C address) in
	# _setup_gpio() and calls hal_pmic_init()/hal_gauge_init() -- see
	# boards/lilygo-t-embed-cc1101 for a worked example. These are the only
	# chips the shared HAL implements today -- a different PMIC/gauge
	# (AXP2101, AXP192, SY6970, MAX17048, ...) stays board-specific in
	# interface.cpp until HAL support for it is added, see src/hal/README.md.
	;-D PMIC_BQ25896=1  # BQ25896 charger via XPowersLib (src/hal/power/pmic.cpp)
	;-D GAUGE_BQ27220=1 # BQ27220 fuel gauge (src/hal/power/gauge.cpp)

	# Navigation layout
	;-D HAS_1_BUTTON=1  # 1 button only (single, double and long pulse on one btn)
						# NexPress:  Short single pulse
						# PrevPress: Short double pulse (300ms interval window)
						# SelPress:  Long pulse (550ms)
						# EscPress:  Extra long pulse (1200ms)
	;-D HAS_2_BUTTONS=1 # 2 buttons (single, double and long pulse on two btns)
						# NextPress: Short single pulse on Btn1
						# SelPress:  Long pulse (600ms) on Btn1
						# PrevPress: Short single pulse on Btn2
						# EscPress:  Long pulse (600ms) on Btn2
	;-D BUTTONS_IDF_COMPONENT=1 # hal_buttons_poll_2 (src/hal/inputs/buttons.cpp) --
								# selects the ESP-IDF `button` component backend for
								# HAS_2_BUTTONS; also add the lib_deps line below.
	;-D HAS_4_BUTTON=1  # 4 buttons (Next, Prev, Sel, Esc)
	-D HAS_3_BUTTON=1   # 3 buttons (Next, Prev, Sel, Next+Prev=EscPress)
	;-D HAS_5_BUTTON=1  # 5 buttons (Up, Down, Left, Right, Sel, Esc=left+right)
	;-D HAS_6_BUTTON=1  # 6 buttons (Up, Down, Left, Right, Sel, Esc)
	;-D HAS_ENCODER=1   # Encoder + 1 button for Select (needs lib_deps below)
	;-D HAS_KEYBOARD=1  # Has a keyboard -- no shared HAL for this, keyboard
						# reading is board-specific, see src/hal/README.md
	;-D HAS_TOUCH=1     # Touchscreen, display the footer bar with btns description
	;-D HAS_TOUCH_NO_BORDER # Small screens not to show the Footer

	# Touch HAL (src/hal/inputs/touch.cpp) -- selected by chip, mirrors
	# PMIC_*/GAUGE_*. Board fills a DeviceTouch (rotation-indexed
	# Mirror/Swap arrays + pins) in _setup_gpio() and calls
	# hal_touch_init()/hal_touch_read() -- see boards/phantom
	# (TOUCH_CTRL_XPT2046) or boards/lilygo-t-deck (TOUCH_CTRL_GT911) for a
	# worked example. Full per-chip notes: src/hal/README.md.
	;-D TOUCH_CTRL_XPT2046=1 # CYD28_TouchscreenR (SPI, resistive) -- also set
							  # CYD28_TouchR_IRQ/MISO/MOSI/CLK/CS below
	;-D TOUCH_CTRL_GT911=1   # SensorLib TouchDrvGT911 (I2C, capacitive) --
							  # needs lib_deps = SensorLib (already in lib/)
	;-D TOUCH_CTRL_CST8XX=1  # SensorLib TouchDrvCSTXXX (I2C, CST816/CST820/
							  # CST92xx family) -- needs lib_deps = SensorLib
	;-D TOUCH_CTRL_FT6X36=1  # SensorLib TouchDrvFT6X36 (I2C, whole FT6206/
							  # FT6236/FT6336(U)/FT3267/FT5336/FT3068 family)
							  # -- needs lib_deps = SensorLib
	;-D TOUCH_CTRL_GT9895=1  # SensorLib TouchDrvGT9895 (I2C) -- needs
							  # lib_deps = SensorLib; chip doesn't report its
							  # own resolution, board must also set
							  # DeviceTouch.raw_width/raw_height
	;-D TOUCH_CTRL_HI8561=1  # SensorLib TouchDrvHI8561 (I2C) -- needs
							  # lib_deps = SensorLib

	# Enables M5Stack CardKb interface over I2C
	;-D USE_CARDKB2=1
	;-D CARDKB2_SDA=32
	;-D CARDKB2_SCL=33

	# Set keys to NOT be allowed on keyboard shortcuts
	;-D RESERVED_NAV_KEYS='"wasd"'

	# Set XPT2046 pinouts for the library
	;-D HAS_RESISTIVE_TOUCH=1 # when using XPT2046 to enable calibration
	;-D CYD28_TouchR_IRQ=36
	;-D CYD28_TouchR_MISO=12
	;-D CYD28_TouchR_MOSI=13
	;-D CYD28_TouchR_CLK=14
	;-D CYD28_TouchR_CS=33

	# Display Driver (Must add the library on `lib_deps`), ArduinoGFX is default, doesn't need any flag
	;-D USE_M5GFX=1       # to use M5GFX library to drive the display using M5.Display.<>() functions
	;-D USE_GXEPD2=1      # to use GxEPD2 display library
	;-D USE_TFT_ESPI=1    # to use TFT_eSPI library
	;-D USE_LOVYANGFX=1   # to use Lovyan GFX driver
	;-D USE_EPD_PAINTER=1 # to use EPD_PAINTER
	;-D USE_DUMMY_TFT=1   # no display at all, every draw call is a no-op

	;-D USE_CANVAS      # to use Sprites/Canvas tft writing method, draw all at once
	;-D ROUND_EDGE_SIZE # to use when the rounded edges hide text or icons on screen

	# Display Pinouts
	# Data bus: 0 Arduino_HWSPI (shared SPI) | 1 Arduino_ESP32QSPI (quad SPI,
	# AMOLEDs) | 2 Arduino_ESP32PAR8Q (8-bit parallel, D0-D7 on one GPIO bank)
	# 3 Arduino_ESP32RGBPanel (16-bit parallel RGB) | 4 Arduino_ESP32DSIPanel
	# (ESP32-P4) | 5 Arduino_ESP32PAR8 (8-bit parallel, D0-D7 across both banks)
	-D TFT_DATABUS_N=0
	# Panel controller. 0 ST7735 | 1 ST7789 | 2 ST7796 | 4 ILI9341 | 24 ILI9342 |
	# 28 ILI9488 | 35 RM67162 | 41 CO5300 | 22 AXS15231B | 49 RGB | 50 DSI …
	# The full table is in the DisplayDrivers README.
	-D TFT_DISPLAY_DRIVER_N=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D TFT_CS=5
	-D TFT_DC=14
	-D TFT_RST=12
	-D TOUCH_CS=-1
	-D TFT_MOSI=15
	-D TFT_SCLK=13
	-D TFT_BL=27
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=32
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	# SDCard When using SD_MMC setup
	;-D USE_SD_MMC=1
	;-D SDM=SD_MMC
	;-D PIN_SD_CMD=16
	;-D PIN_SD_CLK=12
	;-D PIN_SD_D0=14
	;-D PIN_SD_D1=17 # Not needed if using 3 pins setup
	;-D PIN_SD_D2=21 # Not needed if using 3 pins setup
	;-D PIN_SD_D3=18 # Not needed if using 3 pins setup

	# SDCard macros needed to use SPI setup
	-D SDCARD_CS=18     # PIN_SD_D3
	-D SDCARD_SCK=12    # PIN_SD_CLK
	-D SDCARD_MISO=14   # PIN_SD_D0
	-D SDCARD_MOSI=16   # PIN_SD_CMD


lib_deps =
	${env.lib_deps}
	# Only if BUTTONS_IDF_COMPONENT=1 is set above:
	# https://github.com/bmorcelli/ESP32_Button
	# Only if HAS_ENCODER=1 is set above:
	# mathertel/RotaryEncoder @1.5.3

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
