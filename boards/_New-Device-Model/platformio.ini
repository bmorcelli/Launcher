; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:_New-Device-Model]
board = _New-Device-Model
board_build.partitions = support_files/custom_4Mb.csv
build_flags =
	${env.build_flags}
	# Device Specific build flags
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	# Device information
	-D DEVICE_NAME='"My Device Name"'
	-D OTA_TAG='"my_device_ota_tag"' # This tag must be added into the OTA Backend
	-D OTA_EXTRA='"esp=S3"'          # OPTIONAL > to specify an extra query to the search API search
	-D DISABLE_OTA=1                 # Disable OTA Functionality
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000 # data partition above this size on manifest will be maximized
	-D DONT_USE_INPUT_TASK=1         # When inputs share SPI bus with Display or SDCard or other device

	# Headless environment
	;-D HEADLESS=1  # Don't compile display. Serial or WebUI mode only
	;-D LED=38      # Sets the LED pin to blink during start up
	;-D LED_ON=HIGH # LED on state

	# ESP32-P4 config when the slave MCU uses ESP_AT setup instead of esp_hosted
	;-D ENABLE_ESP_AT_INTERFACE=1

	# Flags to increase the font sizes, increasing UI icons and texts
	;-D FP=3
	;-D FM=5
	;-D FG=7

	# Screen default rotation
	-D ROTATION=3
	-D DIMMER_SETUP=20 # Set Default dimmer dim time

	# Battery pin, if using voltage divider
	-D ANALOG_BAT_PIN=38

	# Navigation layout
	;-D HAS_1_BUTTON=1  # 1 or 2 buttons
	-D HAS_3_BUTTON=1  # 3 buttons (Next, Prev, Sel)
	;-D HAS_5_BUTTON=1  # 5 buttons (Up, Down, Left, Right, Sel)
	;-D HAS_ENCODER=1   # Encoder
	;-D HAS_KEYBOARD=1  # Has a keyboard
	;-D HAS_TOUCH=1     # Touchscreen, display the footer bar with btns description

	# Enables M5Stack CardKb interface over I2C
	;-D USE_CARDKB2=1
	;-D CARDKB2_SDA=32
	;-D CARDKB2_SCL=33

	# Set keys to NOT be allowed on keyboard shortcuts
	;-D RESERVED_NAV_KEYS='"wasd"'

	# Set XPT2046 pinouts for the library
	;-D HAS_RESISTIVE_TOUCH=1 # when using XPT2046 to enable calibration
	;-D CYD28_TouchR_IRQ=36
	;-D CYD28_TouchR_MISO=12
	;-D CYD28_TouchR_MOSI=13
	;-D CYD28_TouchR_CLK=14
	;-D CYD28_TouchR_CS=33

	# Display Driver (Must add the library on `lib_deps`), ArduinoGFX is default, doesn't need any flag
	;-D USE_M5GFX=1       # to use M5GFX library to drive the display using M5.Display.<>() functions
	;-D USE_GXEPD2=1      # to use GxEPD2 display library
	;-D USE_TFT_ESPI=1    # to use TFT_eSPI library
	;-D USE_LOVYANGFX=1   # to use Lovyan GFX driver
	;-D USE_EPD_PAINTER=1 # to use EPD_PAINTER
	;-D USE_EPDIY=1       # to use my fork of epdiy

	;-D USE_CANVAS      # to use Sprites/Canvas tft writing method, draw all at once
	;-D ROUND_EDGE_SIZE # to use when the rounded edges hide text or icons on screen

	# Display Pinouts
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D TFT_CS=5
	-D TFT_DC=14
	-D TFT_RST=12
	-D TOUCH_CS=-1
	-D TFT_MOSI=15
	-D TFT_SCLK=13
	-D TFT_BL=27
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=32
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	# SDCard When using SD_MMC setup
	;-D USE_SD_MMC=1
	;-D SDM=SD_MMC
	;-D PIN_SD_CMD=16
	;-D PIN_SD_CLK=12
	;-D PIN_SD_D0=14
	;-D PIN_SD_D1=17 # Not needed if using 3 pins setup
	;-D PIN_SD_D2=21 # Not needed if using 3 pins setup
	;-D PIN_SD_D3=18 # Not needed if using 3 pins setup

	# SDCard macros needed to use SPI setup
	-D SDCARD_CS=18     # PIN_SD_D3
	-D SDCARD_SCK=12    # PIN_SD_CLK
	-D SDCARD_MISO=14   # PIN_SD_D0
	-D SDCARD_MOSI=16   # PIN_SD_CMD


lib_deps =
	${env.lib_deps}

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
