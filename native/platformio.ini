; Launcher UI on the desktop — see src/main.cpp for how this works and what
; it does/doesn't cover.
;
;   pio run -e native -t upload

[platformio]
default_envs = native
build_cache_dir = .pio/buildcache

[env:native]
platform = native
build_type = debug
build_flags =
	-O0 -xc++ -std=c++14
	-lSDL2
	-DUSE_NATIVE_SDL=1
	-DLAUNCHER='"native"'
	-DMAXFILES=256
	-DHAS_5_BUTTONS=1
	-DROTATION=0
	-DTFT_WIDTH=320
	-DTFT_HEIGTH=240
	-DCONFIG_FILE='"/config.conf"'

	; native/sources/ shadows the ESP32/Arduino-only headers display.cpp's
	; translation unit needs just to compile (SD, WiFi, NVS, FreeRTOS, ...);
	; it must come before the real src/include so `#include <SD.h>` resolves
	; to the fake while `#include "settings.h"` still resolves to the real one.
	-Isources
	-I../src
	-I../src/idf
	-I../include
	-I.pio/libdeps/native/LovyanGFX/src
lib_deps =
	symlink://../lib/DisplayDrivers
	lovyan03/LovyanGFX @ ^1.2.7
	bblanchon/ArduinoJson @ ^7.2.1
